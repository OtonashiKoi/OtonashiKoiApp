name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  ci:
    name: Install & Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run project checks
        run: npm run check

  check-skills:
    name: Verify SKILL.md files
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - name: Verify SKILL.md in each skill folder
        run: |
          set -e
          base=".vscode/prompts/skills"
          if [ ! -d "$base" ]; then
            echo "No skills directory found: $base"; exit 1
          fi
          missing=0
          for d in "$base"/*; do
            if [ -d "$d" ]; then
              if [ ! -f "$d/SKILL.md" ]; then
                echo "Missing SKILL.md in $d"; missing=1
              fi
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more SKILL.md files are missing."; exit 1
          fi
          echo "All SKILL.md present." 
