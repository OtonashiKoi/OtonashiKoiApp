<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>戰鬥監視</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.4rem; color: #f0d080; letter-spacing: 0.05em; }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.82rem;
      color: #8b949e;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #3fb950;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }


    /* 總計卡片 */
    .total-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 20px 28px;
      display: inline-flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .total-card .label { color: #8b949e; font-size: 0.9rem; }
    .total-card .number {
      font-size: 2.8rem;
      font-weight: 700;
      color: #f0d080;
      line-height: 1;
    }

    /* Zone 卡片列表 */
    .zones-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }
    .zone-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 18px;
      transition: border-color 0.2s;
    }
    .zone-card.active { border-color: #388bfd; }

    .zone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .zone-name {
      font-size: 1rem;
      font-weight: 600;
    }
    .zone-count {
      font-size: 1.5rem;
      font-weight: 700;
      color: #58a6ff;
    }
    .zone-count.zero { color: #484f58; }

    .monster-line {
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hp-bar-wrap {
      height: 4px;
      background: #21262d;
      border-radius: 2px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .hp-bar {
      height: 100%;
      background: #3fb950;
      border-radius: 2px;
      transition: width 0.5s;
    }

    /* 玩家清單 */
    .fighter-list { list-style: none; }
    .fighter-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid #21262d;
      font-size: 0.82rem;
    }
    .fighter-list li:last-child { border-bottom: none; }
    .fighter-name { color: #e6edf3; }
    .fighter-damage { color: #f0d080; font-variant-numeric: tabular-nums; }

    .empty-zone { color: #484f58; font-size: 0.82rem; text-align: center; padding: 8px 0; }

    /* 區域 emoji 顏色 */
    .zone-beginner .zone-count { color: #3fb950; }
    .zone-normal   .zone-count { color: #58a6ff; }
    .zone-mid      .zone-count { color: #d2a8ff; }
    .zone-hard     .zone-count { color: #ff7b72; }
    .zone-elite    .zone-count { color: #f0d080; }

    .error-msg { color: #ff7b72; font-size: 0.85rem; margin-top: 12px; }

    .refresh-hint { font-size: 0.75rem; color: #484f58; }
  </style>
</head>
<body>

<header>
  <h1>⚔️ 戰鬥監視</h1>
  <div class="status-bar">
    <div class="dot" id="dot"></div>
    <span id="last-update">尚未載入</span>
    <span class="refresh-hint">每 5 秒自動更新</span>
  </div>
</header>

<div class="total-card">
  <div>
    <div class="label">目前戰鬥中（全區）</div>
    <div class="number" id="grand-total">—</div>
  </div>
  <div style="font-size:2rem">🗡️</div>
</div>

<div id="error-msg" class="error-msg" style="display:none"></div>

<div class="zones-grid" id="zones-grid">
  <div style="color:#484f58">請輸入密碼後載入…</div>
</div>

<script>
const ZONE_META = {
  beginner: { label: "🌱 新手區", cls: "zone-beginner" },
  normal:   { label: "⚔️ 一般區", cls: "zone-normal" },
  mid:      { label: "✦ 中級區", cls: "zone-mid" },
  hard:     { label: "🔥 高級區", cls: "zone-hard" },
  elite:    { label: "💀 精英區", cls: "zone-elite" },
};

function fmt(n) {
  return Number(n).toLocaleString();
}

function buildZoneCard(zone) {
  const meta = ZONE_META[zone.zoneKey] || { label: zone.zoneKey, cls: "" };
  const isActive = zone.count > 0;
  const hpPct = (zone.maxHp > 0 && zone.currentHp != null)
    ? Math.max(0, Math.min(100, Math.round(zone.currentHp / zone.maxHp * 100)))
    : null;

  const fighterRows = zone.fighters.length
    ? zone.fighters
        .sort((a, b) => b.damage - a.damage)
        .map(f => `<li>
          <span class="fighter-name">${escHtml(f.name)}</span>
          <span class="fighter-damage">${fmt(f.damage)} dmg</span>
        </li>`).join("")
    : `<li class="empty-zone">暫無戰鬥者</li>`;

  const monsterLine = zone.monsterName
    ? `怪物：${escHtml(zone.monsterName)}${hpPct != null ? `　HP ${hpPct}%` : ""}`
    : "—";

  const hpBar = hpPct != null
    ? `<div class="hp-bar-wrap"><div class="hp-bar" style="width:${hpPct}%;background:${hpPct > 50 ? '#3fb950' : hpPct > 20 ? '#d29922' : '#f85149'}"></div></div>`
    : "";

  return `
    <div class="zone-card ${meta.cls} ${isActive ? "active" : ""}">
      <div class="zone-header">
        <span class="zone-name">${meta.label}</span>
        <span class="zone-count ${zone.count === 0 ? "zero" : ""}">${zone.count}</span>
      </div>
      <div class="monster-line">${monsterLine}</div>
      ${hpBar}
      <ul class="fighter-list">${fighterRows}</ul>
    </div>`;
}

function escHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function loadData() {

  try {
    const res = await fetch("/monitor/combat-status");
    const json = await res.json();
    if (json.status !== "ok") { showError(json.message || "載入失敗"); return; }

    hideError();
    render(json.data);
  } catch (e) {
    showError("無法連線：" + e.message);
  }
}

function render(data) {
  document.getElementById("grand-total").textContent = data.grandTotal;
  document.getElementById("zones-grid").innerHTML = data.zones.map(buildZoneCard).join("");
  document.getElementById("last-update").textContent =
    "最後更新：" + new Date().toLocaleTimeString("zh-TW");
  const dot = document.getElementById("dot");
  dot.style.background = data.grandTotal > 0 ? "#3fb950" : "#484f58";
}

function showError(msg) {
  const el = document.getElementById("error-msg");
  el.textContent = msg;
  el.style.display = "";
}
function hideError() {
  document.getElementById("error-msg").style.display = "none";
}

// 頁面載入立即執行，之後每 5 秒刷新
loadData();
setInterval(loadData, 5000);
</script>
</body>
</html>
