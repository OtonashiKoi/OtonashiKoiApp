<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>直播 Overlay · 會員 + SC 累積</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet" />
<style>
  :root { --scale: 1; --sc1: #7b5cff; --sc2: #ff5ea8; --mem1: #29c7a8; --mem2: #5fd0ff; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: "M PLUS Rounded 1c", "Mochiy Pop One", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* OBS 建議來源尺寸：兩條+觀看列約 720×340；單條約 720×150 */
  #wrap {
    width: 700px; transform: scale(var(--scale)); transform-origin: top left;
    padding: 16px 24px 18px; color: #fff;
    background: linear-gradient(180deg, rgba(28,20,52,0.86), rgba(16,12,32,0.92));
    border: 2px solid rgba(196,167,245,0.55); border-radius: 20px;
    box-shadow: 0 8px 34px rgba(123,92,255,0.35), inset 0 0 22px rgba(123,92,255,0.12);
  }
  #wrap.hidden { display: none; }
  .line + .line { margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(196,167,245,0.18); }
  .line.hidden { display: none; }

  /* 即時觀看人數列（YT / Twitch / 合計） */
  #viewerRow { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; padding-bottom: 12px;
    border-bottom: 1px solid rgba(196,167,245,0.18); font-family: "Mochiy Pop One", sans-serif; }
  #viewerRow.hidden { display: none; }
  .vitem { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; color: #e7defc; white-space: nowrap; transition: opacity .3s; }
  .vitem b { font-size: 21px; color: #fff; }
  .vitem .vdot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; box-shadow: 0 0 9px currentColor; }
  .vitem.yt { color: #ff5c6b; }
  .vitem.tw { color: #b98cff; }
  .vitem.tot { margin-left: auto; color: #ffe7a8; }
  .vitem.tot b { text-shadow: 0 0 12px rgba(255,120,200,.6); }
  .vitem.off { opacity: .38; }

  .lhead { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 8px; }
  .ltitle { font-family: "Mochiy Pop One", sans-serif; font-size: 19px; letter-spacing: .5px; }
  .lval { font-family: "Mochiy Pop One", sans-serif; font-size: 25px; white-space: nowrap; }
  .lval small { font-size: 14px; opacity: .7; }
  #memberLine .ltitle { color: #b6f2e4; text-shadow: 0 0 12px rgba(41,199,168,.4); }
  #memberLine .lval { color: #fff; text-shadow: 0 0 14px rgba(95,208,255,.6); }
  #scLine .ltitle { color: #ffe7a8; text-shadow: 0 2px 0 #6b3f2a, 0 0 14px rgba(255,180,90,.4); }
  #scLine .lval { color: #fff; text-shadow: 0 0 14px rgba(255,120,200,.7); }

  .track { position: relative; height: 20px; border-radius: 11px; margin: 6px 2px 0;
    background: rgba(255,255,255,0.10); box-shadow: inset 0 2px 6px rgba(0,0,0,.4); }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 11px;
    transition: width 1s cubic-bezier(.22,1,.36,1); }
  .fill::after { content: ""; position: absolute; inset: 0; border-radius: 11px;
    background: linear-gradient(180deg, rgba(255,255,255,.35), transparent 60%); }
  #memberFill { background: linear-gradient(90deg, var(--mem1), var(--mem2)); box-shadow: 0 0 14px rgba(95,208,255,.6); }
  #scFill { background: linear-gradient(90deg, var(--sc1), var(--sc2)); box-shadow: 0 0 16px rgba(255,94,168,.7); }

  .dot { position: absolute; top: 50%; width: 16px; height: 16px; margin-top: -8px; margin-left: -8px;
    border-radius: 50%; background: #2a2350; border: 2px solid rgba(196,167,245,.7); transition: all .3s; z-index: 2; }
  .dot.hit { background: #ffd257; border-color: #fff; box-shadow: 0 0 12px #ffd257; }

  #scLabels { position: relative; height: 34px; margin-top: 10px; }
  .lbl { position: absolute; top: 0; max-width: 200px; line-height: 1.25; }
  .lbl .name { font-size: 12px; font-weight: 900; white-space: nowrap; color: #d7defc; }
  .lbl .amt { font-size: 11px; font-weight: 700; color: #9b8cc0; }
  .lbl.hit .name { color: #ffe7a8; }
  .lbl.hit .amt { color: #ffd257; }

  .sub { margin-top: 8px; font-size: 14px; font-weight: 700; text-align: center; white-space: nowrap; }
  #memberSub { color: #cfeeff; }
  #scNext { color: #e7defc; }
  .sub b { color: #ffd257; }

  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.05)} 100%{transform:scale(1)} }
  .celebrate { animation: pop .6s ease; }
</style>
</head>
<body>
  <div id="wrap" class="hidden">
    <div id="viewerRow" class="hidden">
      <span class="vitem yt"><span class="vdot"></span>YouTube <b id="ytVal">—</b></span>
      <span class="vitem tw"><span class="vdot"></span>Twitch <b id="twVal">—</b></span>
      <span class="vitem tot">👁 合計 <b id="totVal">—</b> 人</span>
    </div>
    <div class="line" id="memberLine">
      <div class="lhead"><span class="ltitle">👥 目前會員</span><span class="lval" id="memberVal">— 人</span></div>
      <div class="track"><div class="fill" id="memberFill"></div></div>
      <div class="sub" id="memberSub"></div>
    </div>
    <div class="line" id="scLine">
      <div class="lhead"><span class="ltitle">🎁 全服斗內累積</span><span class="lval" id="scVal">NT$0</span></div>
      <div class="track" id="scTrack"><div class="fill" id="scFill"></div></div>
      <div id="scLabels"></div>
      <div class="sub" id="scNext"></div>
    </div>
  </div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var root = document.documentElement;
  var setVar = function (k, v) { if (v) root.style.setProperty(k, "#" + v.replace(/[^0-9a-f]/gi, "")); };
  if (params.get("scale")) root.style.setProperty("--scale", String(Math.max(0.3, Math.min(4, parseFloat(params.get("scale")) || 1))));
  setVar("--sc1", params.get("sc1")); setVar("--sc2", params.get("sc2"));
  setVar("--mem1", params.get("mem1")); setVar("--mem2", params.get("mem2"));

  // show = both | members | sc  → 可當單獨 OBS 來源
  var show = (params.get("show") || "both").toLowerCase();
  var showMembers = show !== "sc";
  var showSc = show !== "members";
  var memberGoalParam = parseInt(params.get("memberGoal"), 10) || 0;   // 固定會員目標(選填)
  var memberStep = Math.max(1, parseInt(params.get("memberStep"), 10) || 10); // 無固定目標時自動抓下一個整數關卡
  var pollMs = Math.max(2000, parseInt(params.get("poll"), 10) || 4000);

  var showViewers = params.get("viewers") !== "0"; // viewers=0 可關閉觀看人數列

  var wrap = document.getElementById("wrap");
  var memberLine = document.getElementById("memberLine");
  var scLine = document.getElementById("scLine");
  if (!showMembers) memberLine.classList.add("hidden");
  if (!showSc) scLine.classList.add("hidden");

  var viewerRow = document.getElementById("viewerRow");
  var ytItem = document.querySelector(".vitem.yt");
  var twItem = document.querySelector(".vitem.tw");
  var ytVal = document.getElementById("ytVal");
  var twVal = document.getElementById("twVal");
  var totVal = document.getElementById("totVal");
  if (!showViewers && viewerRow) viewerRow.remove();

  var memberVal = document.getElementById("memberVal");
  var memberFill = document.getElementById("memberFill");
  var memberSub = document.getElementById("memberSub");
  var scVal = document.getElementById("scVal");
  var scFill = document.getElementById("scFill");
  var scTrack = document.getElementById("scTrack");
  var scLabels = document.getElementById("scLabels");
  var scNext = document.getElementById("scNext");

  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var ntd = function (n) { return "NT$" + (Number(n) || 0).toLocaleString("en-US"); };
  var lastClaimed = -1, lastMembers = -1;

  function renderViewers(v) {
    if (!showViewers || !viewerRow) return;
    var services = (v && v.services) || [];
    var yt = 0, tw = 0, ytHas = false, twHas = false;
    services.forEach(function (s) {
      if (!s || s.stale || s.board) return;      // 跳過過期枠與看板/打卡枠；沒開台(isLive:false)仍顯示
      var p = s.platform || "";
      if (!p) {                                  // 後端沒帶 platform 時，退回用枠名猜
        var name = String(s.service || "").toLowerCase();
        if (name.indexOf("youtube") >= 0 || name.indexOf("yt") >= 0) p = "youtube";
        else if (name.indexOf("twitch") >= 0) p = "twitch";
      }
      var n = Number(s.viewer) || 0;
      if (p === "youtube") { yt += n; ytHas = true; }
      else if (p === "twitch") { tw += n; twHas = true; }
    });
    viewerRow.classList.remove("hidden");        // 常駐顯示，沒開台也不消失
    ytItem.classList.toggle("off", !ytHas);      // 該平台完全沒枠時才變暗
    twItem.classList.toggle("off", !twHas);
    ytVal.textContent = yt.toLocaleString("en-US");
    twVal.textContent = tw.toLocaleString("en-US");
    totVal.textContent = (yt + tw).toLocaleString("en-US");
  }

  function renderMembers(m) {
    var count = Number(m && m.count) || 0;
    memberVal.innerHTML = count + " <small>人</small>";
    var goal = memberGoalParam > 0 ? memberGoalParam : Math.max(memberStep, Math.ceil((count + 1) / memberStep) * memberStep);
    var pct = goal > 0 ? Math.min(100, (count / goal) * 100) : 0;
    memberFill.style.width = pct + "%";
    var diff = Math.max(0, goal - count);
    memberSub.innerHTML = "目標 <b>" + goal + " 人</b>　還差 <b>" + diff + " 位</b>";
    if (lastMembers >= 0 && count > lastMembers) { memberLine.classList.remove("celebrate"); void memberLine.offsetWidth; memberLine.classList.add("celebrate"); }
    lastMembers = count;
  }

  function renderSc(d) {
    var total = Number(d.total) || 0;
    scVal.innerHTML = ntd(total);
    var maxT = d.maxThreshold || 0;
    var pct = maxT > 0 ? Math.min(100, (total / maxT) * 100) : 0;
    scFill.style.width = pct + "%";

    [].slice.call(scTrack.querySelectorAll(".dot")).forEach(function (x) { x.remove(); });
    scLabels.innerHTML = "";
    if (maxT > 0) {
      (d.milestones || []).forEach(function (ms) {
        var left = Math.min(100, Math.max(0, (ms.threshold / maxT) * 100));
        var dot = document.createElement("div");
        dot.className = "dot" + (ms.claimed ? " hit" : ""); dot.style.left = left + "%";
        scTrack.appendChild(dot);
        var lbl = document.createElement("div");
        lbl.className = "lbl" + (ms.claimed ? " hit" : "");
        if (left <= 12) { lbl.style.left = "0"; lbl.style.textAlign = "left"; }
        else if (left >= 88) { lbl.style.right = "0"; lbl.style.textAlign = "right"; }
        else { lbl.style.left = left + "%"; lbl.style.transform = "translateX(-50%)"; lbl.style.textAlign = "center"; }
        lbl.innerHTML = '<div class="name">' + (ms.claimed ? "✅ " : "🔒 ") + esc(ms.label || "") + '</div><div class="amt">' + ntd(ms.threshold) + "</div>";
        scLabels.appendChild(lbl);
      });
    }

    if (d.nextMilestone) {
      scNext.innerHTML = "下一目標 <b>" + esc(d.nextMilestone.label || "") + "</b>　還差 <b>" + ntd(Math.max(0, d.nextMilestone.threshold - total)) + "</b>";
    } else if (maxT > 0) { scNext.innerHTML = "🎉 全部里程碑已達成！"; } else { scNext.innerHTML = ""; }

    var claimed = (d.milestones || []).filter(function (x) { return x.claimed; }).length;
    if (lastClaimed >= 0 && claimed > lastClaimed) { scLine.classList.remove("celebrate"); void scLine.offsetWidth; scLine.classList.add("celebrate"); }
    lastClaimed = claimed;
  }

  function tick() {
    fetch("/api/stream/overlay", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var d = j && j.data; if (!d) return;
        wrap.classList.remove("hidden");
        renderViewers(d.viewers || {});
        if (showMembers) renderMembers(d.members || { count: 0 });
        if (showSc) renderSc(d.sc || {});
      })
      .catch(function () { /* 靜默重試 */ });
  }
  tick();
  setInterval(tick, pollMs);
})();
</script>
</body>
</html>
