<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>SC 累積條 · OBS Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet" />
<style>
  :root { --scale: 1; --accent1: #7b5cff; --accent2: #ff5ea8; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: "M PLUS Rounded 1c", "Mochiy Pop One", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* OBS 建議來源尺寸約 640×150；用 --scale 微調 */
  #wrap {
    width: 620px; transform: scale(var(--scale)); transform-origin: top left;
    padding: 14px 18px 16px; color: #fff;
    background: linear-gradient(180deg, rgba(28,20,52,0.86), rgba(16,12,32,0.92));
    border: 2px solid rgba(196,167,245,0.55); border-radius: 18px;
    box-shadow: 0 8px 34px rgba(123,92,255,0.35), inset 0 0 22px rgba(123,92,255,0.12);
  }
  #wrap.hidden { display: none; }
  #head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 12px; }
  #title { font-family: "Mochiy Pop One", sans-serif; font-size: 20px; letter-spacing: .5px;
    color: #ffe7a8; text-shadow: 0 2px 0 #6b3f2a, 0 0 14px rgba(255,180,90,.4); }
  #total { font-family: "Mochiy Pop One", sans-serif; font-size: 24px; color: #fff;
    text-shadow: 0 0 14px rgba(255,120,200,.7); }
  #total small { font-size: 14px; opacity: .8; }
  #track { position: relative; height: 22px; border-radius: 12px; margin: 20px 0 8px;
    background: rgba(255,255,255,0.10); box-shadow: inset 0 2px 6px rgba(0,0,0,.4); overflow: visible; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; border-radius: 12px;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    box-shadow: 0 0 16px rgba(255,94,168,.7); transition: width 1s cubic-bezier(.22,1,.36,1); }
  #fill::after { content: ""; position: absolute; inset: 0; border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,.35), transparent 60%); }
  .marker { position: absolute; top: -6px; transform: translateX(-50%); text-align: center; }
  .marker .dot { width: 16px; height: 16px; margin: 0 auto; border-radius: 50%;
    background: #2a2350; border: 2px solid rgba(196,167,245,.7); transition: all .3s; }
  .marker.hit .dot { background: #ffd257; border-color: #fff; box-shadow: 0 0 12px #ffd257; }
  .marker .lbl { margin-top: 16px; font-size: 11px; font-weight: 900; white-space: nowrap;
    color: #d7defc; opacity: .85; }
  .marker.hit .lbl { color: #ffe7a8; opacity: 1; }
  .marker .amt { font-size: 10px; opacity: .6; }
  #next { margin-top: 26px; font-size: 14px; font-weight: 700; color: #e7defc; text-align: center; }
  #next b { color: #ffd257; }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.06)} 100%{transform:scale(1)} }
  #wrap.celebrate { animation: pop .6s ease; }
  #wrap.celebrate #fill { box-shadow: 0 0 30px rgba(255,215,87,.95); }
</style>
</head>
<body>
  <div id="wrap" class="hidden">
    <div id="head">
      <span id="title">🎁 全服斗內累積</span>
      <span id="total">NT$0</span>
    </div>
    <div id="track"><div id="fill"></div></div>
    <div id="next"></div>
  </div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var root = document.documentElement;
  if (params.get("scale")) root.style.setProperty("--scale", String(Math.max(0.3, Math.min(4, parseFloat(params.get("scale")) || 1))));
  if (params.get("accent1")) root.style.setProperty("--accent1", "#" + params.get("accent1").replace(/[^0-9a-f]/gi, ""));
  if (params.get("accent2")) root.style.setProperty("--accent2", "#" + params.get("accent2").replace(/[^0-9a-f]/gi, ""));
  var wrap = document.getElementById("wrap");
  var titleEl = document.getElementById("title");
  var totalEl = document.getElementById("total");
  var fillEl = document.getElementById("fill");
  var trackEl = document.getElementById("track");
  var nextEl = document.getElementById("next");
  if (params.get("title")) titleEl.textContent = params.get("title");
  // hideEmpty=1 → 累積為 0 時整條隱藏（不想開播就有空條可加）
  var hideEmpty = params.get("hideEmpty") === "1";
  var pollMs = Math.max(2000, parseInt(params.get("poll"), 10) || 4000);

  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var fmt = function (n) { return "NT$" + (Number(n) || 0).toLocaleString("en-US"); };
  var lastClaimed = -1;

  function renderMarkers(data) {
    // 移除舊 marker（保留 #fill）
    [].slice.call(trackEl.querySelectorAll(".marker")).forEach(function (m) { m.remove(); });
    var maxT = data.maxThreshold || 0;
    if (!maxT) return;
    (data.milestones || []).forEach(function (m) {
      var left = Math.min(100, (m.threshold / maxT) * 100);
      var el = document.createElement("div");
      el.className = "marker" + (m.claimed ? " hit" : "");
      el.style.left = left + "%";
      el.innerHTML = '<div class="dot"></div><div class="lbl">' + (m.claimed ? "✅ " : "🔒 ") + esc(m.label || "") + '<div class="amt">' + fmt(m.threshold) + "</div></div>";
      trackEl.appendChild(el);
    });
  }

  function render(data) {
    var total = Number(data.total) || 0;
    if (hideEmpty && total <= 0) { wrap.classList.add("hidden"); return; }
    wrap.classList.remove("hidden");

    totalEl.innerHTML = fmt(total);
    var maxT = data.maxThreshold || 0;
    var pct = maxT > 0 ? Math.min(100, (total / maxT) * 100) : 0;
    fillEl.style.width = pct + "%";
    renderMarkers(data);

    if (data.nextMilestone) {
      var diff = Math.max(0, data.nextMilestone.threshold - total);
      nextEl.innerHTML = "下一目標 <b>" + esc(data.nextMilestone.label || "") + "</b>　還差 <b>" + fmt(diff) + "</b>";
    } else if (maxT > 0) {
      nextEl.innerHTML = "🎉 全部里程碑已達成！";
    } else {
      nextEl.innerHTML = "";
    }

    // 有新里程碑解鎖 → 慶祝動畫
    var claimed = (data.milestones || []).filter(function (m) { return m.claimed; }).length;
    if (lastClaimed >= 0 && claimed > lastClaimed) {
      wrap.classList.remove("celebrate"); void wrap.offsetWidth; wrap.classList.add("celebrate");
    }
    lastClaimed = claimed;
  }

  function tick() {
    fetch("/api/stream/sc-bar", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.data) render(j.data); })
      .catch(function () { /* 靜默重試 */ });
  }
  tick();
  setInterval(tick, pollMs);
})();
</script>
</body>
</html>
