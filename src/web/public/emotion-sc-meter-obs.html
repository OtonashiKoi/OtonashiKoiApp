<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OBS 互動值條</title>
  <style>
    :root {
      --text: #f8fbff;
      --accent: #5eead4;
      --track: rgba(72, 79, 90, 0.86);
      --track-line: rgba(233, 240, 255, 0.45);
      --fill-a: #67e8f9;
      --fill-b: #ffb347;
      --fill-c: #ff6b6b;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      user-select: none;
    }

    #widget {
      position: fixed;
      left: 40px;
      top: 28px;
      width: min(720px, 92vw);
      padding: 2px 6px 6px;
      cursor: grab;
      z-index: 20;
    }

    #widget.dragging { cursor: grabbing; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      pointer-events: none;
    }

    .label {
      color: var(--text);
      font-size: clamp(28px, 3.1vw, 34px);
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .score {
      color: var(--accent);
      font-size: clamp(28px, 3vw, 34px);
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .bar {
      position: relative;
      width: 100%;
      height: clamp(20px, 2.2vw, 28px);
      border-radius: 999px;
      background: var(--track);
      border: 2px solid var(--track-line);
      overflow: hidden;
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    .fill {
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--fill-a), var(--fill-b), var(--fill-c));
      box-shadow: 0 0 18px rgba(255, 179, 71, 0.64);
      transition: width 180ms ease-out;
    }

    #fx {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }

    .meteor {
      position: absolute;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 0.36rem;
      font-size: clamp(20px, 2.1vw, 30px);
      font-weight: 800;
      color: #fff7ee;
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.5), 0 8px 30px rgba(0, 0, 0, 0.4);
      padding: 0.08rem 0.5rem 0.16rem;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255, 209, 140, 0.15), rgba(255, 255, 255, 0.06));
      border: 1px solid rgba(255, 243, 225, 0.26);
      animation: meteor-fly var(--meteor-duration, 5200ms) cubic-bezier(0.18, 0.84, 0.31, 1) forwards;
      user-select: none;
    }

    .meteor::before {
      content: "";
      position: absolute;
      left: calc(100% + 8px);
      top: 50%;
      width: 210px;
      height: 7px;
      border-radius: 999px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, rgba(255, 225, 173, 0.95), rgba(255, 255, 255, 0));
      filter: blur(1.1px);
      opacity: 0.9;
    }

    .meteor::after {
      content: "";
      position: absolute;
      left: calc(100% + 48px);
      top: 50%;
      width: 170px;
      height: 2px;
      border-radius: 999px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, rgba(255, 246, 229, 0.9), rgba(255, 255, 255, 0));
      opacity: 0.85;
    }

    @keyframes meteor-fly {
      0% { transform: translate3d(0, 0, 0) scale(0.88) rotate(0deg); opacity: 0; }
      9% { opacity: 1; }
      100% { transform: translate3d(-125vw, var(--meteor-drop, 16vh), 0) scale(1.08) rotate(var(--meteor-rot, -6deg)); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="fx"></div>
  <div id="widget" title="按住拖曳可移動；雙擊可重設位置">
    <div class="row">
      <div class="label">互動值</div>
      <div id="score" class="score">0 / 100</div>
    </div>
    <div class="bar">
      <div id="fill" class="fill"></div>
    </div>
  </div>

  <script>
    (function () {
      const WS_URL = "ws://127.0.0.1:11180/sub";
      const MAX_SCORE = 100;
      const SC_GAIN = 100;
      const COMMENT_GAIN = 1;
      const METEOR_RESET_DELAY_MS = 3200;
      const DECAY_PER_SEC = 0; // 不自動倒扣
      const POS_KEY = "emotion_obs_widget_pos_v1";
      const GIFT_EMOJIS = ["🎁", "💎", "🪙", "🌟", "🧧", "💝", "🚀"];

      const widget = document.getElementById("widget");
      const scoreEl = document.getElementById("score");
      const fillEl = document.getElementById("fill");
      const fxEl = document.getElementById("fx");

      let score = 0;
      let lastTick = performance.now();
      let ws = null;
      let meteorResetTimer = null;
      let wasMaxed = false;
      let maxBurstDone = false;
      const params = new URLSearchParams(location.search);

      let drag = null;

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      function renderScore() {
        const shown = Math.round(score);
        const pct = (shown / MAX_SCORE) * 100;
        scoreEl.textContent = shown + " / " + MAX_SCORE;
        fillEl.style.width = pct.toFixed(1) + "%";
      }

      function applyScoreDelta(amount) {
        const prev = score;
        score = clamp(score + amount, 0, MAX_SCORE);
        renderScore();
        const isMaxed = score >= MAX_SCORE;
        if (isMaxed && !maxBurstDone && !wasMaxed && prev < MAX_SCORE) {
          spawnMeteorBurst(14, "✨ 互動爆發");
          scheduleResetAfterMeteor();
          maxBurstDone = true;
        }
        wasMaxed = isMaxed;
      }

      function randomGift() {
        return GIFT_EMOJIS[Math.floor(Math.random() * GIFT_EMOJIS.length)];
      }

      function buildGiftLabel(item) {
        const d = (item && item.data) ? item.data : item || {};
        const name = d.displayName || d.name || "SC";
        const amount = d.purchaseAmount || d.amountValue || d.amount || "";
        return randomGift() + " " + name + (amount ? (" " + amount) : "");
      }

      function spawnMeteor(label, durationMs) {
        const node = document.createElement("div");
        node.className = "meteor";
        node.textContent = label;
        node.style.right = "-15vw";
        node.style.top = (6 + Math.random() * 42).toFixed(1) + "vh";
        node.style.setProperty("--meteor-drop", ((12 + Math.random() * 22).toFixed(1) + "vh"));
        node.style.setProperty("--meteor-rot", ((-10 + Math.random() * 8).toFixed(1) + "deg"));
        node.style.setProperty("--meteor-duration", ((durationMs || 4300 + Math.random() * 1400).toFixed(0) + "ms"));
        fxEl.appendChild(node);
        setTimeout(function () { node.remove(); }, (durationMs || 5600) + 500);
      }

      function spawnMeteorBurst(count, labelPrefix) {
        for (let i = 0; i < count; i += 1) {
          const delay = Math.floor(Math.random() * 1800);
          setTimeout(function () {
            spawnMeteor((labelPrefix || randomGift()) + (Math.random() < 0.4 ? (" " + randomGift()) : ""));
          }, delay);
        }
      }

      function scheduleResetAfterMeteor() {
        if (meteorResetTimer) clearTimeout(meteorResetTimer);
        meteorResetTimer = setTimeout(function () {
          score = 0;
          wasMaxed = false;
          maxBurstDone = false;
          renderScore();
        }, METEOR_RESET_DELAY_MS);
      }

      function normalizePlatform(service, userId) {
        const s = String(service || "").toLowerCase();
        const u = String(userId || "").toLowerCase();
        if (s.includes("youtube") || s === "yt") return "youtube";
        if (s.includes("twitch") || s === "tw") return "twitch";
        if (u.startsWith("tw-") || u.startsWith("twitch-")) return "twitch";
        if (u.startsWith("yt-") || u.startsWith("youtube-") || u.startsWith("uc")) return "youtube";
        return "unknown";
      }

      function countUnicodeEmoji(text) {
        if (!text) return 0;
        const m = String(text).match(/[\p{Extended_Pictographic}]/gu);
        return m ? m.length : 0;
      }

      function countHtmlEmojiOrSticker(text) {
        if (!text) return 0;
        const m = String(text).match(/<img\b[^>]*>|:[a-z0-9_]{2,}:/gi);
        return m ? m.length : 0;
      }

      function isScOrGift(item) {
        const d = (item && item.data) ? item.data : item || {};
        const txt = String(d.comment || "").toLowerCase();
        const badges = Array.isArray(d.badges)
          ? d.badges.map(function (b) { return String((b && b.label) || "").toLowerCase(); }).join(" ")
          : "";
        if (d.hasGift === true) return true;
        if (d.isSuperChat === true || d.isPaid === true) return true;
        if (d.hasDonation === true || d.isDonation === true) return true;
        if (Number(d.purchaseAmount || 0) > 0) return true;
        if (Number(d.amount || 0) > 0 || Number(d.amountValue || 0) > 0 || Number(d.price || 0) > 0) return true;
        if (txt.includes("superchat") || txt.includes("sc")) return true;
        if (txt.includes("斗內") || txt.includes("donate") || txt.includes("donation")) return true;
        if (badges.includes("super") || badges.includes("gift") || badges.includes("贈禮") || badges.includes("斗內")) return true;
        return false;
      }

      function getEmoteLikeScore(item) {
        const d = (item && item.data) ? item.data : item || {};
        const platform = normalizePlatform(d.service, d.userId);
        const rawComment = String(d.comment || "");

        let hits = 0;
        hits += Math.min(4, countUnicodeEmoji(rawComment));
        hits += Math.min(4, countHtmlEmojiOrSticker(rawComment));
        if (d.sticker || d.superSticker || d.stickerUrl || d.emoji || d.emotes) hits += 2;
        if (Array.isArray(d.emotes) && d.emotes.length > 0) hits += Math.min(4, d.emotes.length);

        if (platform === "twitch") {
          const twTokens = rawComment.match(/\b[A-Z][A-Za-z0-9]{2,}\b/g);
          if (twTokens && twTokens.length > 0) hits += Math.min(3, twTokens.length);
        }

        if (platform === "youtube" && hits > 0) hits += 1;
        return Math.min(15, hits * 2);
      }

      function connectWs() {
        try {
          ws = new WebSocket(WS_URL);
        } catch (_) {
          setTimeout(connectWs, 2200);
          return;
        }

        ws.onmessage = function (event) {
          let payload;
          try {
            payload = JSON.parse(event.data);
          } catch (_) {
            return;
          }

          const comments = (payload && payload.type === "comments" && payload.data && Array.isArray(payload.data.comments))
            ? payload.data.comments
            : [];

          comments.forEach(function (item) {
            if (isScOrGift(item)) {
              spawnMeteorBurst(18, buildGiftLabel(item));
              applyScoreDelta(SC_GAIN);
              scheduleResetAfterMeteor();
              return;
            }
            applyScoreDelta(COMMENT_GAIN);
            const emoteScore = getEmoteLikeScore(item);
            if (emoteScore > 0) applyScoreDelta(emoteScore);
          });
        };

        ws.onclose = function () {
          setTimeout(connectWs, 2000);
        };
      }

      function tick(now) {
        const dt = (now - lastTick) / 1000;
        lastTick = now;
        score = clamp(score - DECAY_PER_SEC * dt, 0, MAX_SCORE);
        if (score < MAX_SCORE) {
          wasMaxed = false;
          maxBurstDone = false;
        }
        if (score >= MAX_SCORE && !maxBurstDone) {
          spawnMeteorBurst(14, "✨ 互動爆發");
          scheduleResetAfterMeteor();
          maxBurstDone = true;
          wasMaxed = true;
        }
        renderScore();
        requestAnimationFrame(tick);
      }

      function savePos() {
        const x = parseFloat(widget.style.left) || 0;
        const y = parseFloat(widget.style.top) || 0;
        localStorage.setItem(POS_KEY, JSON.stringify({ x: x, y: y }));
      }

      function restorePos() {
        try {
          const raw = localStorage.getItem(POS_KEY);
          if (!raw) return;
          const p = JSON.parse(raw);
          if (typeof p.x === "number") widget.style.left = p.x + "px";
          if (typeof p.y === "number") widget.style.top = p.y + "px";
        } catch (_) {}
      }

      function startDrag(e) {
        const rect = widget.getBoundingClientRect();
        drag = {
          offsetX: e.clientX - rect.left,
          offsetY: e.clientY - rect.top
        };
        widget.classList.add("dragging");
        widget.setPointerCapture(e.pointerId);
      }

      function onDrag(e) {
        if (!drag) return;
        const w = widget.offsetWidth;
        const h = widget.offsetHeight;
        const x = clamp(e.clientX - drag.offsetX, 0, window.innerWidth - w);
        const y = clamp(e.clientY - drag.offsetY, 0, window.innerHeight - h);
        widget.style.left = x + "px";
        widget.style.top = y + "px";
      }

      function endDrag(e) {
        if (!drag) return;
        drag = null;
        widget.classList.remove("dragging");
        try { widget.releasePointerCapture(e.pointerId); } catch (_) {}
        savePos();
      }

      widget.addEventListener("pointerdown", startDrag);
      widget.addEventListener("pointermove", onDrag);
      widget.addEventListener("pointerup", endDrag);
      widget.addEventListener("pointercancel", endDrag);
      widget.addEventListener("dblclick", function () {
        widget.style.left = "40px";
        widget.style.top = "28px";
        savePos();
      });

      if (params.get("test") === "1") {
        setTimeout(function () { spawnMeteorBurst(16, "🧪 特效測試"); }, 900);
      }

      restorePos();
      renderScore();
      connectWs();
      requestAnimationFrame(function (t) {
        lastTick = t;
        requestAnimationFrame(tick);
      });
    })();
  </script>
</body>
</html>
