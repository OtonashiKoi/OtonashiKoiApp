<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日感謝名單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&family=Cormorant+Garamond:ital,wght@1,500&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  /* ── 今日感謝名單輪播：白×薰衣草×金 角色風外框 ── */
  :root {
    --paper: rgba(249, 248, 253, 0.94);
    --lav-2: #c9c3ea;
    --lav-3: #9d93d8;
    --wisteria: #7d6fc9;
    --wisteria-deep: #5d4fae;
    --gold: #c9a44c;
    --gold-soft: #e3c987;
    --ink: #3a3654;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif; user-select: none; }
  body.testbg { background: #24203a; }

  /* OBS(CEF) 殘影修正：強制每幀整幀重繪（同 alert.html） */
  #repaint {
    position: fixed; inset: 0; pointer-events: none; z-index: 99;
    background: rgba(255, 255, 255, 0.002);
    animation: repaintTick 0.5s steps(2) infinite;
  }
  @keyframes repaintTick { 50% { opacity: 0.4; } }

  #card {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(430px, 92vw);
    padding: 30px 26px 22px;
    background: var(--paper);
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(93, 79, 174, 0.25), 0 0 0 1px rgba(157, 147, 216, 0.35);
  }
  /* 金色雙線外框 + 蕾絲虛線內框（帽簷金線 / 層裙蕾絲語彙） */
  #card::before {
    content: ''; position: absolute; inset: 6px;
    border: 1.6px solid var(--gold);
    border-radius: 10px; pointer-events: none;
  }
  #card::after {
    content: ''; position: absolute; inset: 11px;
    border: 1px dashed var(--lav-2);
    border-radius: 8px; pointer-events: none;
  }
  /* 四角 ◆ */
  .cdia { position: absolute; width: 9px; height: 9px; transform: rotate(45deg);
    background: linear-gradient(135deg, var(--lav-3), var(--wisteria-deep)); z-index: 2; }
  .cdia.c1 { top: 1px; left: 1px; } .cdia.c2 { top: 1px; right: 1px; }
  .cdia.c3 { bottom: 1px; left: 1px; } .cdia.c4 { bottom: 1px; right: 1px; }

  /* 頂部小花徽章（髮飾花） */
  #emblem {
    position: absolute; top: -25px; left: 50%; transform: translateX(-50%);
    width: 50px; height: 50px; z-index: 3;
    filter: drop-shadow(0 3px 6px rgba(93, 79, 174, 0.35));
    animation: emspin 26s linear infinite;
  }
  @keyframes emspin { to { transform: translateX(-50%) rotate(360deg); } }

  /* 紫藤花串（右上垂掛） */
  #wisteria { position: absolute; top: -8px; right: 26px; z-index: 3;
    transform-origin: top center; animation: sway 4.5s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(7deg); } }
  #wisteria .bead { width: 10px; height: 13px; margin: 2px auto;
    background: linear-gradient(160deg, var(--lav-3), var(--wisteria-deep));
    border-radius: 50% 50% 55% 55%; }
  #wisteria .bead:nth-child(2) { width: 8px; }
  #wisteria .bead:nth-child(3) { width: 6px; height: 11px; }
  #wisteria .bead:nth-child(4) { width: 4px; height: 9px; }

  /* 標題 */
  #title { text-align: center; margin-bottom: 4px; }
  #title .main {
    font-size: 21px; font-weight: 900; letter-spacing: 6px; padding-left: 6px; color: var(--ink);
  }
  #title .sub {
    font-family: 'Cormorant Garamond', serif; font-style: italic;
    font-size: 12px; letter-spacing: 4px; color: var(--lav-3); margin-top: 2px;
  }
  #secbadge {
    display: inline-block; margin: 10px auto 12px;
    font-size: 13px; font-weight: 800; letter-spacing: 3px;
    color: #fff; padding: 3px 20px;
    background: linear-gradient(135deg, var(--lav-3), var(--wisteria-deep));
    clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
  }
  #secbadge.gold { background: linear-gradient(135deg, var(--gold-soft), var(--gold)); color: #3a2c08; }

  /* 名單列 */
  #list { min-height: 168px; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 10px; margin: 4px 2px;
    border-left: 3px solid var(--lav-2);
    background: rgba(201, 195, 234, 0.14);
    border-radius: 0 8px 8px 0;
    animation: rowin 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .row:nth-child(2) { animation-delay: 0.08s; }
  .row:nth-child(3) { animation-delay: 0.16s; }
  .row:nth-child(4) { animation-delay: 0.24s; }
  .row:nth-child(5) { animation-delay: 0.32s; }
  @keyframes rowin { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  .row .name { font-size: 16px; font-weight: 800; color: var(--ink);
    max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .val { font-size: 15px; font-weight: 900; color: var(--wisteria-deep); }
  .row.top1 { border-left-color: var(--gold); background: rgba(227, 201, 135, 0.22); }
  .row.top1 .val { color: #a07d22; }
  .row .star { color: var(--gold); margin-right: 4px; }

  .empty {
    text-align: center; padding: 56px 0; color: var(--lav-3);
    font-size: 14px; letter-spacing: 3px; font-weight: 700;
  }

  /* 頁尾 + 輪播圓點 */
  #foot { text-align: center; margin-top: 8px; }
  #dots { display: inline-flex; gap: 6px; }
  #dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--lav-2); transition: all 0.3s; }
  #dots i.on { background: var(--wisteria); transform: scale(1.3); }

  /* 換頁動畫 */
  #pagewrap { transition: opacity 0.35s ease, transform 0.35s ease; }
  #pagewrap.out { opacity: 0; transform: translateY(8px); }
</style>
</head>
<body>
<div id="repaint"></div>
<div id="card">
  <div class="cdia c1"></div><div class="cdia c2"></div><div class="cdia c3"></div><div class="cdia c4"></div>
  <svg id="emblem" viewBox="0 0 50 50">
    <circle cx="25" cy="25" r="23" fill="rgba(249,248,253,0.95)" stroke="#c9a44c" stroke-width="1.4"/>
    <circle cx="25" cy="25" r="19" fill="none" stroke="#c9c3ea" stroke-width="1" stroke-dasharray="2 5"/>
    <g transform="translate(25 25)">
      <g fill="#7d6fc9" stroke="#5d4fae" stroke-width="0.8">
        <ellipse cx="0" cy="-8.5" rx="4.4" ry="6.4"/>
        <ellipse cx="0" cy="-8.5" rx="4.4" ry="6.4" transform="rotate(72)"/>
        <ellipse cx="0" cy="-8.5" rx="4.4" ry="6.4" transform="rotate(144)"/>
        <ellipse cx="0" cy="-8.5" rx="4.4" ry="6.4" transform="rotate(216)"/>
        <ellipse cx="0" cy="-8.5" rx="4.4" ry="6.4" transform="rotate(288)"/>
      </g>
      <circle r="3.6" fill="#c9a44c"/>
      <circle r="2.3" fill="#7ec3e8"/>
    </g>
  </svg>
  <div id="wisteria"><div class="bead"></div><div class="bead"></div><div class="bead"></div><div class="bead"></div></div>

  <div id="title">
    <div class="main" id="titleText">今日感謝</div>
    <div class="sub">─ ✦ thank you for your support ✦ ─</div>
  </div>

  <div id="pagewrap">
    <div style="text-align:center"><span id="secbadge">載入中</span></div>
    <div id="list"></div>
  </div>

  <div id="foot"><span id="dots"></span></div>
</div>

<script>
(function () {
  // 參數：?title=文字 換標題｜?per=5 每頁筆數｜?interval=7 輪播秒數｜?bg=1 測試深底
  const qs = new URLSearchParams(location.search);
  if (qs.get("bg") === "1") document.body.classList.add("testbg");
  const per = Math.max(3, Math.min(8, Number(qs.get("per")) || 5));
  const intervalSec = Math.max(4, Math.min(30, Number(qs.get("interval")) || 7));
  const titleText = (qs.get("title") || "").trim();
  if (titleText) document.getElementById("titleText").textContent = titleText;

  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const listEl = document.getElementById("list");
  const badgeEl = document.getElementById("secbadge");
  const dotsEl = document.getElementById("dots");
  const wrapEl = document.getElementById("pagewrap");

  let pages = [];   // [{ kind: 'donor'|'member', rows: [...] }]
  let pageIdx = 0;

  function chunk(arr, n) {
    const out = [];
    for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
    return out;
  }

  function buildPages(data) {
    const p = [];
    for (const rows of chunk(data.donors || [], per)) p.push({ kind: "donor", rows });
    for (const rows of chunk(data.members || [], per)) p.push({ kind: "member", rows });
    if (!p.length) p.push({ kind: "empty", rows: [] });
    return p;
  }

  function renderPage() {
    const page = pages[pageIdx % pages.length];
    if (page.kind === "empty") {
      badgeEl.textContent = "✦ 今日感謝 ✦";
      badgeEl.className = "";
      badgeEl.id = "secbadge";
      listEl.innerHTML = `<div class="empty">─ 虛位以待，感謝每一份支持 ─</div>`;
    } else if (page.kind === "donor") {
      badgeEl.textContent = "💎 今日斗內";
      badgeEl.className = "gold";
      listEl.innerHTML = page.rows.map((r, i) => `
        <div class="row ${pageIdx === 0 && i === 0 ? "top1" : ""}">
          <span class="name">${pageIdx === 0 && i === 0 ? '<span class="star">✦</span>' : ""}${esc(r.name)}</span>
          <span class="val">NT$ ${Number(r.total).toLocaleString()}</span>
        </div>`).join("");
    } else {
      badgeEl.textContent = "👑 新加入會員";
      badgeEl.className = "";
      listEl.innerHTML = page.rows.map((r) => `
        <div class="row">
          <span class="name">${esc(r.name)}</span>
          <span class="val">${esc(r.eventText)}${r.label ? "・" + esc(r.label) : ""}</span>
        </div>`).join("");
    }
    dotsEl.innerHTML = pages.map((_, i) => `<i class="${i === pageIdx % pages.length ? "on" : ""}"></i>`).join("");
  }

  function nextPage() {
    wrapEl.classList.add("out");
    setTimeout(() => {
      pageIdx = (pageIdx + 1) % pages.length;
      renderPage();
      wrapEl.classList.remove("out");
    }, 350);
  }

  // ?demo=1 示範資料（不打 API，預覽樣式用）
  const DEMO = {
    donors: [
      { name: "音無鯉魚王", total: 5200 }, { name: "夜空的星星", total: 1500 },
      { name: "路過的勇者", total: 800 }, { name: "鯉魚衛隊長", total: 520 }, { name: "小小鯉魚", total: 100 }
    ],
    members: [
      { name: "新來的鯉魚", eventText: "加入會員", label: "C級" },
      { name: "回鍋的鯉魚", eventText: "回歸會員", label: "B級" }
    ]
  };

  async function refresh() {
    try {
      const json = qs.get("demo") === "1"
        ? { status: "ok", data: DEMO }
        : await (await fetch("/api/stream-overlay/thanks")).json();
      if (json.status !== "ok") return;
      const newPages = buildPages(json.data);
      const changed = JSON.stringify(newPages) !== JSON.stringify(pages);
      if (changed) {
        pages = newPages;
        pageIdx = Math.min(pageIdx, pages.length - 1);
        renderPage();
      }
    } catch (_) { /* 下一輪再試 */ }
  }

  refresh().then(renderPage);
  setInterval(nextPage, intervalSec * 1000);
  setInterval(refresh, 60_000);
})();
</script>
</body>
</html>
