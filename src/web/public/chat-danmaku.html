<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>聊天室彈幕</title>
  <style>
    @import url('https://cdn.jsdelivr.net/npm/@fontsource/lxgw-wenkai-tc@latest/index.css');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: transparent; overflow: hidden;
      font-family: 'LXGW WenKai TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    }

    /* niconico 風彈幕：純文字、白字黑邊、由右往左等速飛過，無頭像/名字/等級等任何資訊 */
    .dm {
      position: fixed; left: 0; top: 0;
      white-space: nowrap; pointer-events: none; will-change: transform;
      font-size: 48px; font-weight: 700; line-height: 1.2; color: #fff;
      -webkit-text-stroke: 2px rgba(0,0,0,0.92);
      text-shadow: 0 0 5px rgba(0,0,0,0.6), 1px 1px 2px rgba(0,0,0,0.95);
    }

    #ws-dot {
      position: fixed; top: 6px; right: 8px; width: 6px; height: 6px; border-radius: 50%;
      background: #888; transition: background 0.4s; z-index: 9999;
    }
    #ws-dot.on  { background: #50fa7b; box-shadow: 0 0 6px #50fa7b; }
    #ws-dot.off { background: #ff5555; box-shadow: 0 0 6px #ff5555; }

    #status {
      position: fixed; top: 10px; left: 12px; font-size: 13px; font-weight: 700; color: #ffd479;
      background: rgba(8,12,28,0.88); padding: 6px 12px; border: 1px solid rgba(255,180,90,0.5);
      border-radius: 4px; max-width: 92vw; text-shadow: 1px 1px 3px #000; display: none; z-index: 9999;
    }
    #status.show { display: block; }
  </style>
</head>
<body>
  <div id="ws-dot"></div>
  <div id="status"></div>

  <script>
    const API_BASE = '';
    const urlKey = new URLSearchParams(location.search).get('key');
    let CHAT_KEY = urlKey || localStorage.getItem('chat_overlay_key') || '';
    if (urlKey) localStorage.setItem('chat_overlay_key', urlKey);

    // ── 可調參數 ──────────────────────────────────────────────
    const DURATION_MS = 8000; // 一則彈幕橫越畫面的時間（越大越慢，等速）
    const LANE_HEIGHT = 66;   // 每條軌道高度（含行距）
    const TOP_MARGIN  = 16;   // 上下留白
    const LANE_GAP_MS = 140;  // 同一軌道前後兩則的最小間隔（防重疊）

    const dot      = document.getElementById('ws-dot');
    const statusEl = document.getElementById('status');
    function setStatus(m){ if(!m){statusEl.className='';statusEl.textContent='';} else {statusEl.className='show';statusEl.textContent=m;} }

    // 純文字：去掉 <img>/HTML 標籤與圖片網址，只留留言文字
    function extractText(raw){
      return String(raw||'').replace(/<img[^>]*>/gi,' ').replace(/<[^>]+>/g,'')
        .replace(/https?:\/\/\S+\.(?:png|jpe?g|gif|webp|avif)(\?\S*)?/gi,'').trim();
    }

    // ── 分軌：每條軌道記錄「下次可用時間」，優先挑空閒軌道，隨機分散；全忙則挑最快空出的 ──
    const lanes = []; // index -> 下次可用的 performance.now() 時間戳
    function laneCount(){ return Math.max(1, Math.floor((innerHeight - TOP_MARGIN * 2) / LANE_HEIGHT)); }
    function pickLane(){
      const n = laneCount();
      while (lanes.length < n) lanes.push(0);
      const now = performance.now();
      const free = [];
      for (let i = 0; i < n; i++) if (now >= lanes[i]) free.push(i);
      if (free.length) return free[Math.floor(Math.random() * free.length)];
      let best = 0; for (let i = 1; i < n; i++) if (lanes[i] < lanes[best]) best = i;
      return best;
    }

    function shoot(text){
      if (!text) return;
      const el = document.createElement('div');
      el.className = 'dm';
      el.textContent = text;
      el.style.visibility = 'hidden';
      document.body.appendChild(el);

      const w = el.offsetWidth;
      const lane = pickLane();
      el.style.top = (TOP_MARGIN + lane * LANE_HEIGHT) + 'px';
      el.style.visibility = '';

      const total = innerWidth + w;          // 從畫面右外緣 → 完全滑出左外緣
      const now = performance.now();
      // 該軌道在「這則的尾巴離開畫面右緣」之前不接新的，避免追撞重疊
      lanes[lane] = now + (w / total) * DURATION_MS + LANE_GAP_MS;

      const anim = el.animate(
        [ { transform: `translateX(${innerWidth}px)` },
          { transform: `translateX(${-w}px)` } ],
        { duration: DURATION_MS, easing: 'linear' }
      );
      anim.onfinish = () => el.remove();
      anim.oncancel = () => el.remove();
    }

    function enqueue(d){
      shoot(extractText(d.comment || d.body || ''));
    }

    // ── SSE（密碼保護，與 chat.html 同來源）──
    let es, firstError = true;
    function connect(){
      if (!CHAT_KEY){ dot.className='off'; setStatus('⚠ 請在網址結尾加上 ?key=你的密碼（OBS 來源網址也要帶）'); return; }
      dot.className=''; setStatus('● 連線中…');
      es = new EventSource(`${API_BASE}/api/chat/overlay-stream?key=${encodeURIComponent(CHAT_KEY)}`);
      es.onopen = () => { dot.className='on'; setStatus(''); firstError=true; };
      es.onmessage = (ev) => {
        try { const c = JSON.parse(ev.data); const d = c && c.data ? c.data : c; if (d) enqueue(d); } catch(_){}
      };
      es.onerror = () => {
        dot.className='off';
        setStatus(firstError ? '✕ 連線失敗（密碼是否正確？），重試中…' : '✕ 連線中斷，重試中…');
        firstError=false; es.close(); setTimeout(connect, 5000);
      };
    }
    connect();
  </script>
</body>
</html>
