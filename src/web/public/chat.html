<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>聊天室</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800&display=swap');

    :root {
      --overlay-pad-x: clamp(10px, 2.8vw, 16px);
      --overlay-pad-y: clamp(10px, 2.4vw, 16px);
      --card-gap: clamp(7px, 1.5vw, 10px);
      --text-main: #f7f3ee;
      --text-soft: #d8d3dc;
      --panel-top: rgba(26, 21, 31, 0.94);
      --panel-bottom: rgba(12, 12, 19, 0.91);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      color: var(--text-main);
      font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    }

    /* OBS 直播疊加層：不攔截畫面上的滑鼠事件。 */
    #chat-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: var(--card-gap);
      max-height: 100vh;
      padding: var(--overlay-pad-y) var(--overlay-pad-x) 26px;
      overflow: hidden;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 91%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 91%, transparent 100%);
    }

    /* 單則留言由獨立名牌與對話窗組成。 */
    .msg {
      --accent: #9cc8e8;
      --accent-rgb: 156, 200, 232;
      --accent-ink: #39718f;
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      flex: 0 0 auto;
      align-items: flex-start;
      gap: 3px;
      width: 100%;
      min-width: 0;
      padding: 0 2px;
      animation: messageIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .msg.is-player {
      --accent: #e8c56b;
      --accent-rgb: 232, 197, 107;
      --accent-ink: #91651b;
    }

    .msg.is-member {
      --accent: #7be2ad;
      --accent-rgb: 123, 226, 173;
      --accent-ink: #27845f;
    }

    .msg.is-sub {
      --accent: #c79bf4;
      --accent-rgb: 199, 155, 244;
      --accent-ink: #7654ac;
    }

    /* 已綁定會員依遊戲同步位階顯示不同外框。 */
    .msg.tier-c {
      --accent: #73dfbd;
      --accent-rgb: 115, 223, 189;
      --accent-ink: #237e64;
    }

    .msg.tier-b {
      --accent: #b69af5;
      --accent-rgb: 182, 154, 245;
      --accent-ink: #7051ac;
    }

    .msg.tier-a {
      --accent: #ffd170;
      --accent-rgb: 255, 209, 112;
      --accent-ink: #94661a;
    }

    .msg.tier-s {
      --accent: #ff8c86;
      --accent-rgb: 255, 140, 134;
      --accent-ink: #b44848;
    }

    .msg.tier-ss {
      --accent: #87e8ff;
      --accent-rgb: 135, 232, 255;
      --accent-ink: #287c91;
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translate3d(-16px, -3px, 0) scale(0.985); }
      to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    .msg-header {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px 7px;
      width: fit-content;
      max-width: calc(100% - 20px);
      min-width: 0;
      min-height: 34px;
      margin-left: 2px;
      padding: 8px 15px 5px 10px;
      border-radius: 12px 12px 5px 12px;
      background:
        url('/static/app/assets/split/ui-name-slot-full.png') center top / 100% 34px no-repeat,
        linear-gradient(155deg, rgba(255, 253, 247, 0.97), rgba(244, 230, 239, 0.96));
      box-shadow:
        0 0 0 1px rgba(var(--accent-rgb), 0.66),
        0 4px 12px rgba(70, 42, 66, 0.25),
        0 0 10px rgba(var(--accent-rgb), 0.18);
    }

    .msg-header::after {
      content: '♥';
      position: absolute;
      right: -7px;
      bottom: -6px;
      display: grid;
      place-items: center;
      width: 17px;
      height: 17px;
      border: 1px solid rgba(var(--accent-rgb), 0.72);
      border-radius: 50%;
      color: var(--accent-ink);
      background: #fff8f2;
      box-shadow: 0 2px 7px rgba(70, 42, 66, 0.25);
      font-size: 9px;
      line-height: 1;
    }

    .msg-bubble {
      position: relative;
      width: calc(100% - 10px);
      min-width: 0;
      margin-left: 10px;
      padding: 10px 15px 11px 17px;
      overflow: visible;
      border: 1px solid rgba(var(--accent-rgb), 0.58);
      border-radius: 5px 12px 12px 12px;
      background:
        radial-gradient(circle at 96% 0%, rgba(var(--accent-rgb), 0.17), transparent 35%),
        linear-gradient(100deg, rgba(var(--accent-rgb), 0.07), transparent 46%),
        linear-gradient(155deg, rgba(255, 253, 247, 0.96), rgba(245, 235, 242, 0.95));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.78),
        0 6px 15px rgba(70, 42, 66, 0.24),
        0 0 10px rgba(var(--accent-rgb), 0.12);
    }

    .msg-bubble::before {
      content: '';
      position: absolute;
      top: -5px;
      left: 12px;
      width: 10px;
      height: 10px;
      border-top: 1px solid rgba(var(--accent-rgb), 0.58);
      border-left: 1px solid rgba(var(--accent-rgb), 0.58);
      background: rgba(255, 252, 246, 0.98);
      transform: rotate(45deg);
    }

    .msg-bubble::after {
      content: '♡';
      position: absolute;
      top: 7px;
      right: 11px;
      color: var(--accent-ink);
      font-size: 14px;
      font-weight: 800;
      line-height: 1;
      opacity: 0.74;
    }

    .badge-lv {
      flex-shrink: 0;
      padding: 2px 7px 2px;
      border: 1px solid rgba(255, 237, 180, 0.66);
      border-radius: 999px;
      color: #2a1c08;
      background: linear-gradient(145deg, #ffe49a, #c89a3d);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.44), 0 0 8px rgba(232, 197, 107, 0.18);
      font-size: clamp(10px, 2.4vw, 11px);
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: 0.25px;
      text-shadow: none;
      white-space: nowrap;
    }

    .author-name {
      min-width: 0;
      color: var(--accent-ink);
      font-size: clamp(15px, 3.8vw, 17px);
      font-weight: 800;
      line-height: 1.28;
      letter-spacing: 0.2px;
      overflow-wrap: anywhere;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.76);
    }

    .badge-title {
      flex: 0 1 auto;
      max-width: min(48%, 190px);
      padding: 2px 8px;
      overflow: hidden;
      border: 1px solid rgba(var(--accent-rgb), 0.38);
      border-radius: 999px;
      color: #65576a;
      background: rgba(var(--accent-rgb), 0.11);
      font-size: clamp(9px, 2.2vw, 10px);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0.35px;
      text-overflow: ellipsis;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.72);
      white-space: nowrap;
    }

    .badge-title::before {
      content: '✦';
      margin-right: 4px;
      color: var(--accent-ink);
    }

    .msg-content {
      position: relative;
      z-index: 1;
      padding-right: 12px;
      color: #403542;
      font-size: clamp(14px, 3.5vw, 16px);
      font-weight: 500;
      line-height: 1.48;
      letter-spacing: 0.05px;
      overflow-wrap: anywhere;
      word-break: break-word;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.76);
    }

    .inline-emote {
      display: inline;
      width: auto;
      height: 1.45em;
      margin: 0 2px;
      vertical-align: -0.28em;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.6));
    }

    .msg-images {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(132px, 100%), 1fr));
      gap: 6px;
      max-width: 360px;
      margin-top: 3px;
    }

    .msg-images img {
      display: block;
      width: 100%;
      max-width: 230px;
      max-height: 150px;
      object-fit: cover;
      border: 1px solid rgba(var(--accent-rgb), 0.34);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.26);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.34);
    }

    #ws-dot {
      position: fixed;
      z-index: 20;
      top: 7px;
      right: 9px;
      width: 7px;
      height: 7px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: #77727f;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
    }

    #ws-dot.on  { background: #65e59b; box-shadow: 0 0 7px rgba(101, 229, 155, 0.9); }
    #ws-dot.off { background: #ff746c; box-shadow: 0 0 7px rgba(255, 116, 108, 0.9); }

    #status {
      position: fixed;
      z-index: 30;
      top: 10px;
      left: 12px;
      display: none;
      max-width: calc(100vw - 34px);
      padding: 8px 12px;
      border: 1px solid rgba(232, 197, 107, 0.58);
      border-radius: 10px;
      color: #ffe6a5;
      background: linear-gradient(145deg, rgba(31, 24, 30, 0.96), rgba(14, 13, 19, 0.96));
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.36);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      text-shadow: 0 1px 3px #000;
    }

    #status.show { display: block; }

    @media (max-width: 360px) {
      .msg { padding: 0 1px; }
      .msg-bubble { width: calc(100% - 7px); margin-left: 7px; }
      .badge-title { max-width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .msg { animation-duration: 0.01ms; }
    }

    /* =====================================================================
       音無恋・紫藤夜語 — 原創 OBS 聊天外觀
       保留「名牌在上、對話在下」的閱讀方式；框型、裝飾與色彩全部重新設計。
       ===================================================================== */
    :root {
      --wisteria-1: #d8c1ff;
      --wisteria-2: #9a73d9;
      --wisteria-3: #5f438f;
      --night-1: rgba(24, 19, 38, 0.94);
      --night-2: rgba(12, 12, 24, 0.94);
      --moon: #f5e8bd;
      --ink: #f8f3ff;
      --ink-soft: #d5cbe4;
    }

    #chat-wrap {
      gap: clamp(11px, 2vw, 15px);
      padding: clamp(16px, 3vw, 24px) clamp(12px, 3vw, 20px) 34px;
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 88%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 0%, #000 88%, transparent 100%);
    }

    .msg {
      --accent: #b797e8;
      --accent-rgb: 183, 151, 232;
      --accent-ink: #f2e8ff;
      gap: 0;
      padding: 0 4px 0 13px;
      animation: wisteriaMessageIn 0.38s cubic-bezier(0.18, 0.86, 0.28, 1) both;
    }

    /* 花瓣掠過訊息左側，避免再使用參考圖常見的愛心／緞帶裝飾。 */
    .msg::before,
    .msg::after {
      content: '';
      position: absolute;
      z-index: 4;
      pointer-events: none;
      border-radius: 70% 30% 70% 30%;
      background: linear-gradient(145deg, rgba(var(--accent-rgb), 0.9), rgba(255,255,255,0.35));
      filter: drop-shadow(0 0 4px rgba(var(--accent-rgb), 0.45));
      transform: rotate(34deg);
    }
    .msg::before { top: 13px; left: 1px; width: 7px; height: 11px; }
    .msg::after  { top: 27px; left: 8px; width: 5px; height: 8px; opacity: 0.72; }

    .msg.is-player {
      --accent: #d7b76f;
      --accent-rgb: 215, 183, 111;
      --accent-ink: #fff0bd;
    }
    .msg.is-member {
      --accent: #9fcaaf;
      --accent-rgb: 159, 202, 175;
      --accent-ink: #d9ffe8;
    }
    .msg.is-sub {
      --accent: #bd9ee9;
      --accent-rgb: 189, 158, 233;
      --accent-ink: #f0e2ff;
    }
    .msg.tier-c {
      --accent: #7bcbb7;
      --accent-rgb: 123, 203, 183;
      --accent-ink: #d4fff4;
    }
    .msg.tier-b {
      --accent: #a68ae3;
      --accent-rgb: 166, 138, 227;
      --accent-ink: #eee5ff;
    }
    .msg.tier-a {
      --accent: #e4c06f;
      --accent-rgb: 228, 192, 111;
      --accent-ink: #fff1bd;
    }
    .msg.tier-s {
      --accent: #e78c9d;
      --accent-rgb: 231, 140, 157;
      --accent-ink: #ffe3e8;
    }
    .msg.tier-ss {
      --accent: #88d8ef;
      --accent-rgb: 136, 216, 239;
      --accent-ink: #dcf9ff;
    }

    @keyframes wisteriaMessageIn {
      from { opacity: 0; transform: translate3d(-22px, -6px, 0); filter: blur(2px); }
      55%  { opacity: 1; }
      to   { opacity: 1; transform: translate3d(0, 0, 0); filter: blur(0); }
    }

    /* 名字牌像從紫藤枝垂下的木牌：不使用參考圖的白色膠囊框。 */
    .msg-header {
      position: relative;
      z-index: 3;
      gap: 5px 8px;
      width: auto;
      max-width: calc(100% - 32px);
      min-height: 32px;
      margin: 0 0 -3px 17px;
      padding: 6px 37px 7px 13px;
      overflow: visible;
      border: 1px solid rgba(var(--accent-rgb), 0.48);
      border-left: 3px solid rgba(var(--accent-rgb), 0.92);
      border-radius: 3px 15px 3px 10px;
      background:
        linear-gradient(90deg, rgba(var(--accent-rgb), 0.18), transparent 45%),
        linear-gradient(155deg, rgba(42, 31, 62, 0.97), rgba(17, 15, 30, 0.96));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 5px 16px rgba(5, 3, 12, 0.42),
        0 0 13px rgba(var(--accent-rgb), 0.13);
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 50%, calc(100% - 15px) 100%, 0 100%);
    }

    /* 垂掛紫藤花串：由多層 radial-gradient 原創繪製，不使用外部參考素材。 */
    .msg-header::before {
      content: '';
      position: absolute;
      z-index: 4;
      top: -12px;
      left: -24px;
      width: 35px;
      height: 55px;
      border: 0;
      border-radius: 0;
      background:
        radial-gradient(ellipse at 50% 11%, rgba(214,193,255,0.98) 0 11%, transparent 12%),
        radial-gradient(ellipse at 30% 28%, rgba(174,133,229,0.96) 0 13%, transparent 14%),
        radial-gradient(ellipse at 69% 30%, rgba(197,160,244,0.94) 0 13%, transparent 14%),
        radial-gradient(ellipse at 43% 49%, rgba(139,95,201,0.96) 0 14%, transparent 15%),
        radial-gradient(ellipse at 67% 57%, rgba(173,127,226,0.92) 0 12%, transparent 13%),
        radial-gradient(ellipse at 48% 75%, rgba(119,78,180,0.94) 0 12%, transparent 13%),
        radial-gradient(ellipse at 50% 92%, rgba(103,66,160,0.9) 0 9%, transparent 10%),
        linear-gradient(90deg, transparent 47%, rgba(129,105,151,0.78) 48% 52%, transparent 53%);
      filter: drop-shadow(0 3px 5px rgba(38, 17, 62, 0.7));
      transform: rotate(-5deg);
    }

    /* 右端以月牙代表「音無」，跟愛心徽章的參考設計完全分離。 */
    .msg-header::after {
      content: '☾';
      position: absolute;
      z-index: 5;
      right: 12px;
      bottom: auto;
      top: 50%;
      width: auto;
      height: auto;
      border: 0;
      border-radius: 0;
      color: var(--moon);
      background: transparent;
      box-shadow: none;
      font-family: Georgia, serif;
      font-size: 21px;
      line-height: 1;
      text-shadow: 0 0 9px rgba(245, 232, 189, 0.6);
      transform: translateY(-53%) rotate(-10deg);
    }

    .badge-lv {
      padding: 2px 7px;
      border: 1px solid rgba(var(--accent-rgb), 0.45);
      border-radius: 4px;
      color: var(--accent-ink);
      background: rgba(var(--accent-rgb), 0.14);
      box-shadow: none;
      font-size: clamp(9px, 2.2vw, 10px);
      line-height: 1.25;
    }

    .author-name {
      color: var(--ink);
      font-size: clamp(14px, 3.7vw, 17px);
      line-height: 1.3;
      text-shadow: 0 0 9px rgba(var(--accent-rgb), 0.48), 0 2px 3px rgba(0,0,0,0.8);
    }

    .badge-title {
      max-width: min(48%, 190px);
      padding: 1px 7px;
      border: 0;
      border-left: 1px solid rgba(var(--accent-rgb), 0.55);
      border-radius: 0;
      color: var(--ink-soft);
      background: transparent;
      font-size: clamp(9px, 2.15vw, 10px);
      text-shadow: 0 1px 2px rgba(0,0,0,0.75);
    }
    .badge-title::before { content: '藤'; color: var(--accent); opacity: 0.85; }

    /* 對話窗像夜色中的薄霧信箋，底部「恋」印記是音無恋專屬識別。 */
    .msg-bubble {
      position: relative;
      z-index: 1;
      width: calc(100% - 15px);
      min-height: 48px;
      margin: 0 0 0 3px;
      padding: 14px 48px 13px 24px;
      overflow: hidden;
      border: 1px solid rgba(var(--accent-rgb), 0.34);
      border-left: 2px solid rgba(var(--accent-rgb), 0.68);
      border-radius: 4px 17px 17px 17px;
      background:
        radial-gradient(ellipse at 95% 100%, rgba(var(--accent-rgb), 0.18), transparent 35%),
        linear-gradient(115deg, rgba(var(--accent-rgb), 0.1), transparent 38%),
        linear-gradient(155deg, var(--night-1), var(--night-2));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        0 9px 22px rgba(4, 3, 10, 0.42),
        0 0 15px rgba(var(--accent-rgb), 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .msg-bubble::before {
      content: '';
      position: absolute;
      inset: auto auto 0 0;
      width: 72%;
      height: 2px;
      border: 0;
      background: linear-gradient(90deg, rgba(var(--accent-rgb), 0.9), rgba(var(--accent-rgb), 0.08), transparent);
      transform: none;
    }

    .msg-bubble::after {
      content: '恋';
      position: absolute;
      top: auto;
      right: 13px;
      bottom: 10px;
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border: 1px solid rgba(var(--accent-rgb), 0.52);
      border-radius: 50%;
      color: rgba(var(--accent-rgb), 0.88);
      background: rgba(var(--accent-rgb), 0.06);
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 12px;
      font-weight: 800;
      opacity: 1;
      transform: rotate(-8deg);
    }

    .msg-content {
      padding-right: 0;
      color: var(--ink);
      font-size: clamp(14px, 3.5vw, 16px);
      font-weight: 500;
      line-height: 1.55;
      letter-spacing: 0.08px;
      text-shadow: 0 2px 3px rgba(0,0,0,0.72);
    }

    .msg-images img {
      border-color: rgba(var(--accent-rgb), 0.45);
      border-radius: 6px 14px 14px 14px;
      box-shadow: 0 5px 16px rgba(0,0,0,0.48);
    }

    #status {
      border-color: rgba(183, 151, 232, 0.52);
      border-radius: 4px 13px 13px 13px;
      color: #eadcff;
      background: linear-gradient(155deg, rgba(42,31,62,0.97), rgba(15,13,27,0.97));
    }

    @media (max-width: 360px) {
      .msg { padding-left: 10px; }
      .msg-header { margin-left: 16px; padding-right: 32px; }
      .msg-bubble { width: calc(100% - 10px); padding-left: 18px; padding-right: 42px; }
      .badge-title { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div id="ws-dot"></div>
  <div id="status"></div>
  <div id="chat-wrap"></div>

  <script>
    // 同源（相對路徑）：任何電腦從 otonashikoi.org/chat.html 都能讀。
    // 留言改走伺服器中繼的 SSE（不再直連本機 OneComme），需帶密碼。
    const API_BASE   = '';
    // 密碼：優先取網址 ?key=，否則用上次記住的，再否則跳出輸入框。
    const urlKey = new URLSearchParams(location.search).get('key');
    let CHAT_KEY = urlKey || localStorage.getItem('chat_overlay_key') || '';
    if (urlKey) localStorage.setItem('chat_overlay_key', urlKey);
    const MAX_MSGS   = 30;
    const STORE_KEY  = 'chat_history_v1';
    const CACHE_TTL  = 10 * 1000; // 10 秒內同一人不重複打 API

    const wrap = document.getElementById('chat-wrap');
    const dot  = document.getElementById('ws-dot');

    // https 頁面會擋 http 圖片(mixed content)→ 自動升級;本機 OneComme 圖片(localhost)無法跨機讀，維持原樣
    function httpsify(u) {
      if (typeof u !== 'string') return u;
      if (u.startsWith('http://')) {
        if (/^http:\/\/(localhost|127\.0\.0\.1)/i.test(u)) return u;
        return 'https://' + u.slice(7);
      }
      return u;
    }

    // ── 玩家資料快取 ──
    const profileCache = new Map();

    async function fetchProfile(platform, userId) {
      const key = `${platform}|${userId}`;
      const hit = profileCache.get(key);
      if (hit && Date.now() - hit.fetchedAt < CACHE_TTL) return hit.data;
      try {
        const r = await fetch(`${API_BASE}/api/chat/viewer-profile?platform=${encodeURIComponent(platform)}&userId=${encodeURIComponent(userId)}`);
        if (!r.ok) return { found: false };
        const j = await r.json();
        profileCache.set(key, { data: j, fetchedAt: Date.now() });
        return j;
      } catch (_) {
        return { found: false };
      }
    }

    // ── localStorage 持久化 ──
    // 每筆紀錄只存原始 commentObj（輕量），渲染時重新查最新 profile
    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); }
      catch (_) { return []; }
    }

    function saveHistory(list) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify(list.slice(-MAX_MSGS))); }
      catch (_) {}
    }

    // 歷史列表（記憶體中的主副本）
    let history = loadHistory();

    // 用來去重的 ID 集合（避免刷新後重複渲染 WebSocket 又推了同一則）
    const seenIds = new Set(history.map(c => (c.data || c).id).filter(Boolean));

    // ── 解析平台 / 會員狀態 ──
    function normPlatform(comment) {
      // OneComme WS 原始結構：payload.data.comments[i].data.service
      const d   = comment.data || comment;
      const svc = (d.service || '').toLowerCase();
      const uid = (d.userId || '').toLowerCase();
      if (svc.includes('youtube') || svc === 'yt') return 'youtube';
      if (svc.includes('twitch')  || svc === 'tw') return 'twitch';
      if (svc.includes('nico'))                    return 'niconico';
      // service 不明時從 userId 前綴推斷（與後端 normalizePlatform 一致）
      if (uid.startsWith('tw-') || uid.startsWith('twitch-')) return 'twitch';
      if (uid.startsWith('uc')  || uid.startsWith('yt-') || uid.startsWith('youtube-')) return 'youtube';
      return svc || 'unknown';
    }

    function memberStatus(d) {
      if (d.isMember === true) return 'member';
      if (d.isSubscriber === true) return 'sub';
      if (d.badges?.some(b => /會員|member/i.test(b.label || ''))) return 'member';
      if (d.badges?.some(b => /訂閱|subscriber/i.test(b.label || ''))) return 'sub';
      return '';
    }

    // ── 判斷 img 標籤是否為表情符號（emote）──
    function isEmote(imgTag) {
      if (/class=["'][^"']*(emote|emoji)[^"']*["']/i.test(imgTag)) return true;   // class="emote"/"emoji"（Twitch/YT）
      if (/data-custom-emoji=["']true["']/i.test(imgTag))  return true;   // YT 自訂表情
      if (/data-[a-z]+=["'][^"']*emoji[^"']*["']/i.test(imgTag)) return true; // 任何 data-*emoji
      if (/alt=["'][^"']{1,8}["']/.test(imgTag)) return true;             // alt 很短（貼圖縮寫）
      return false;
    }

    // ── 從訊息資料中收集「真正的貼圖/圖片」URL（排除 emote）──
    function extractImages(d) {
      const urls = [];
      const raw = d.comment || d.body || '';

      // 1. d.img / d.image（單張欄位，非 emote）
      if (d.img)   urls.push(d.img);
      if (d.image) urls.push(d.image);

      // 2. d.images / d.attachments（陣列）
      if (Array.isArray(d.images))      d.images.forEach(i => urls.push(typeof i === 'string' ? i : (i?.url || i?.src)));
      if (Array.isArray(d.attachments)) d.attachments.forEach(a => urls.push(typeof a === 'string' ? a : (a?.url || a?.src)));

      // 3. comment 內含 <img> 但 **不是 emote** 的標籤
      const imgTagRe = /(<img[^>]+>)/gi;
      let m;
      while ((m = imgTagRe.exec(raw)) !== null) {
        if (!isEmote(m[1])) {
          const srcMatch = m[1].match(/src=["']([^"']+)["']/i);
          if (srcMatch) urls.push(srcMatch[1]);
        }
      }

      // 4. 裸露的圖片 URL（直接貼連結）
      const urlRe = /https?:\/\/\S+\.(?:png|jpe?g|gif|webp|avif)(\?\S*)?/gi;
      let u;
      while ((u = urlRe.exec(raw)) !== null) urls.push(u[0]);

      return [...new Set(urls.filter(Boolean))];
    }

    // ── 把 comment 渲染成安全的 HTML（emote 變小圖，其他標籤轉純文字）──
    function buildContentHtml(raw) {
      if (!raw) return document.createDocumentFragment();
      // 把 <img> 處理：emote → 行內小圖；非 emote → 移除（已由 extractImages 獨立處理）
      const processed = raw.replace(/(<img[^>]+>)/gi, (tag) => {
        if (isEmote(tag)) {
          const srcMatch = tag.match(/src=["']([^"']+)["']/i);
          const altMatch = tag.match(/alt=["']([^"']*)["']/i);
          if (srcMatch) {
            const src = httpsify(srcMatch[1]);
            const alt = altMatch ? altMatch[1] : '';
            return `<img src="${src}" alt="${alt}" class="inline-emote" onerror="this.remove()">`;
          }
          return '';
        }
        return ''; // 非 emote img 移除（獨立顯示）
      });
      // 解析後遞迴走訪：保留文字節點與 inline-emote 圖（emote 可能巢狀在 <span> 內，
      // 只看 top-level 會漏掉 → 用 walk 遞迴收集）
      const tmp = document.createElement('div');
      tmp.innerHTML = processed;
      const frag = document.createDocumentFragment();
      (function walk(node) {
        node.childNodes.forEach((c) => {
          if (c.nodeType === Node.TEXT_NODE) {
            const cleaned = c.textContent.replace(/https?:\/\/\S+\.(?:png|jpe?g|gif|webp|avif)(\?\S*)?/gi, '');
            if (cleaned.trim()) frag.appendChild(document.createTextNode(cleaned));
          } else if (c.nodeName === 'IMG') {
            if (c.classList.contains('inline-emote')) frag.appendChild(c.cloneNode());
          } else {
            walk(c);
          }
        });
      })(tmp);
      return frag;
    }

    // ── 純文字版（用於空值判斷）──
    function extractText(raw) {
      return raw
        .replace(/<img[^>]*>/gi, ' ')
        .replace(/<[^>]+>/g, '')
        .replace(/https?:\/\/\S+\.(?:png|jpe?g|gif|webp|avif)(\?\S*)?/gi, '')
        .trim();
    }

    // ── 渲染單則訊息（傳入已查好的 profile） ──
    function renderMsg(commentObj, profile) {
      const d       = commentObj.data || commentObj;
      const rawName = d.displayName || d.name || d.author || '匿名';
      const rawText    = d.comment || d.body || '';
      const images     = extractImages(d);
      // 內容片段（含行內 emote/emoji）；用它判斷有沒有東西可顯示，避免「只有貼圖/表情」被當空訊息丟掉
      const contentFrag = buildContentHtml(rawText);
      const hasContent  = contentFrag.childNodes.length > 0;

      if (!hasContent && images.length === 0) return null;

      const platform = normPlatform(commentObj);
      const mStatus  = memberStatus(d);
      const showName = profile.found ? (profile.displayName || rawName) : rawName;
      const memberTier = String(profile.membershipTier || '').trim().toLowerCase();
      const validMemberTier = /^(c|b|a|s|ss)$/.test(memberTier) ? memberTier : '';

      const el = document.createElement('div');
      el.className = [
        'msg',
        profile.found ? 'is-player' : '',
        (profile.isMember && !validMemberTier) || (mStatus === 'member' && !profile.found) ? 'is-member' : '',
        mStatus === 'sub'    && !profile.found ? 'is-sub'    : '',
        validMemberTier ? `tier-${validMemberTier}` : '',
      ].filter(Boolean).join(' ');
      if (validMemberTier) el.dataset.memberTier = validMemberTier.toUpperCase();

      // ── 上排 header ──
      const header = document.createElement('div');
      header.className = 'msg-header';

      if (profile.found) {
        const lv = document.createElement('span');
        lv.className = 'badge-lv';
        lv.textContent = `Lv.${profile.level}`;
        header.appendChild(lv);
      }

      const name = document.createElement('span');
      name.className = 'author-name';
      name.textContent = showName;
      header.appendChild(name);

      if (profile.found && profile.title) {
        const ttl = document.createElement('span');
        ttl.className = 'badge-title';
        ttl.textContent = profile.title;
        ttl.title = profile.title;
        header.appendChild(ttl);
      }

      el.appendChild(header);

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';

      // ── 文字內容（含行內 emote）──
      if (hasContent) {
        const body = document.createElement('div');
        body.className = 'msg-content';
        body.appendChild(contentFrag);
        bubble.appendChild(body);
      }

      // ── 圖片 ──
      if (images.length > 0) {
        const imgWrap = document.createElement('div');
        imgWrap.className = 'msg-images';
        images.forEach(url => {
          const img = document.createElement('img');
          img.src = httpsify(url);
          img.alt = '';
          img.loading = 'lazy';
          img.onerror = () => img.remove();
          imgWrap.appendChild(img);
        });
        bubble.appendChild(imgWrap);
      }

      el.appendChild(bubble);

      return el;
    }

    // ── 加入一則訊息（去重 + 存檔 + 渲染） ──
    async function addMsg(commentObj, skipSave = false) {
      const d      = commentObj.data || commentObj;
      const content = (d.comment || d.body || '').trim();
      const hasImg  = !!(d.img || d.image || d.images?.length || d.attachments?.length ||
                        /<img/i.test(content) ||
                        /https?:\/\/\S+\.(?:png|jpe?g|gif|webp|avif)/i.test(content));
      const displayText = extractText(content);
      if (!displayText && !hasImg) return;

      // 去重
      const msgId = d.id || null;
      if (msgId) {
        if (seenIds.has(msgId)) return;
        seenIds.add(msgId);
      }

      // 存進歷史
      if (!skipSave) {
        history.push(commentObj);
        if (history.length > MAX_MSGS) history = history.slice(-MAX_MSGS);
        saveHistory(history);
      }

      // 查最新 profile（即時連動）
      const platform   = normPlatform(commentObj);
      const platformId = d.userId || '';   // d.id 是訊息ID不是玩家ID，不能混用
      let profile = { found: false };
      if (platformId) profile = await fetchProfile(platform, platformId);

      const el = renderMsg(commentObj, profile);
      if (!el) return;

      wrap.prepend(el);

      while (wrap.children.length > MAX_MSGS) {
        wrap.lastChild.remove();
      }
    }

    // ── 啟動時先還原歷史訊息（最新在最上方，舊訊息往下排列） ──
    async function restoreHistory() {
      for (const commentObj of [...history].reverse()) {
        const d          = commentObj.data || commentObj;
        const platform   = normPlatform(commentObj);
        const platformId = d.userId || '';
        let profile = { found: false };
        if (platformId) profile = await fetchProfile(platform, platformId);
        const el = renderMsg(commentObj, profile);
        if (el) wrap.appendChild(el);
      }
    }

    // ── 設定狀態提示（OBS 內可見；正常連上後自動隱藏）──
    const statusEl = document.getElementById('status');
    function setStatus(msg) {
      if (!msg) { statusEl.className = ''; statusEl.textContent = ''; }
      else { statusEl.className = 'show'; statusEl.textContent = msg; }
    }

    // ── 伺服器中繼留言 SSE（密碼保護）──
    // OBS 無法跳出輸入框，密碼一律從網址 ?key= 帶入：
    //   https://otonashikoi.org/chat.html?key=你的密碼
    let es;
    let firstError = true;
    function connect() {
      if (!CHAT_KEY) {
        dot.className = 'off';
        setStatus('⚠ 請在網址結尾加上 ?key=你的密碼（OBS 來源網址也要帶）');
        return;
      }

      dot.className = '';
      setStatus('● 連線中…');
      es = new EventSource(`${API_BASE}/api/chat/overlay-stream?key=${encodeURIComponent(CHAT_KEY)}`);

      es.onopen = () => { dot.className = 'on'; setStatus(''); firstError = true; };
      es.onmessage = (ev) => {
        try {
          const c = JSON.parse(ev.data);
          // 伺服器送 { data: <OneComme d> }，與舊 WS 單則留言同結構
          if (c && (c.data || c.comment || c.name)) addMsg(c.data ? c : { data: c });
        } catch (_) {}
      };
      es.onerror = () => {
        dot.className = 'off';
        // 連不上可能是密碼錯誤或網路；持續重試，並在畫面上顯示讓 OBS 也看得到
        setStatus(firstError ? '✕ 連線失敗（密碼是否正確？），重試中…' : '✕ 連線中斷，重試中…');
        firstError = false;
        es.close();
        setTimeout(connect, 5000);
      };
    }

    // 視覺預覽：網址加 ?preview=1 可在不連正式留言的情況下檢查 OBS 版面。
    async function renderPreview() {
      dot.style.display = 'none';
      setStatus('');
      const fixtures = [
        {
          comment: { data: { id: 'preview-ss', service: 'youtube', userId: 'preview-ss', name: '音無恋', comment: '晚安，歡迎來到紫藤盛開的音無樂園。' } },
          profile: { found: true, displayName: '音無恋', level: 50, title: '樂園的守望者', isMember: true, membershipTier: 'SS' }
        },
        {
          comment: { data: { id: 'preview-a', service: 'twitch', userId: 'preview-a', name: '黎宇 Yukiri', comment: '新的名字牌跟對話窗分開後，長訊息也應該保有足夠的呼吸空間，並且自然往下延伸。' } },
          profile: { found: true, displayName: '黎宇☗鯉魚☖Yukiri', level: 42, title: '紫藤花下的旅人', isMember: true, membershipTier: 'A' }
        },
        {
          comment: { data: { id: 'preview-b', service: 'youtube', userId: 'preview-b', name: '煞暮', comment: '紫藤花、月牙與恋的印記看起來很有音無恋自己的味道。' } },
          profile: { found: true, displayName: '煞暮', level: 35, title: '月夜冒險者', isMember: true, membershipTier: 'B' }
        },
        {
          comment: { data: { id: 'preview-guest', service: 'youtube', userId: 'preview-guest', name: '路過的觀眾', comment: '第一次來看直播，大家好！' } },
          profile: { found: false }
        }
      ];
      fixtures.forEach(({ comment, profile }) => {
        const el = renderMsg(comment, profile);
        if (el) wrap.appendChild(el);
      });
    }

    const previewMode = new URLSearchParams(location.search).get('preview') === '1';
    if (previewMode) renderPreview();
    else restoreHistory().then(connect);
  </script>
</body>
</html>
