<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>戰鬥展示</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');

    :root {
      --gold: #f0d080; --gold2: #c89a20;
      --ice:  #a8d8f8; --ice2:  #4a90c8;
      --red:  #ff6060; --red2:  #c0392b;
      --panel: rgba(6,14,36,0.90);
      --border: rgba(140,185,255,0.20);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body {
      width:100%; height:100%;
      background:transparent;
      overflow:hidden;
      font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;
      color:#dde8ff;
    }

    /* ══════════════ LAYOUT ══════════════ */
    #root {
      width:100vw; height:100vh;
      display:grid;
      grid-template-rows: auto 1fr auto;
      grid-template-columns: 1fr 1fr;
      gap:8px;
      padding:10px;
    }

    /* ══════════════ ZONE TAB BUTTONS ══════════════ */
    #zone-tabs {
      grid-column: 1 / -1;
      display:flex; gap:6px;
    }
    .zone-tab {
      flex:1;
      padding:6px 0;
      text-align:center;
      font-size:12px;
      font-weight:700;
      letter-spacing:2px;
      cursor:pointer;
      border:1px solid var(--border);
      border-bottom:none;
      background:rgba(8,18,42,0.5);
      color:rgba(200,220,255,0.4);
      clip-path:polygon(8px 0%,100% 0%,100% 100%,0% 100%);
      transition:all 0.25s;
      user-select:none;
    }
    .zone-tab.active {
      background:rgba(20,40,90,0.85);
      color:var(--gold);
      border-color:rgba(240,208,128,0.35);
      text-shadow:0 0 10px rgba(240,208,128,0.5);
    }

    /* ══════════════ BATTLE STAGE ══════════════ */
    #battle-stage {
      grid-column:1/-1;
      position:relative;
      overflow:hidden;
      background:
        linear-gradient(180deg,
          rgba(2,6,20,0.0) 0%,
          rgba(4,10,30,0.55) 60%,
          rgba(6,14,40,0.85) 100%
        );
      border:1px solid var(--border);
      border-top:none;
      display:flex;
      flex-direction:column;
    }

    /* 星星背景 */
    #stars {
      position:absolute; inset:0; pointer-events:none; overflow:hidden;
    }
    .star {
      position:absolute;
      border-radius:50%;
      background:#fff;
      animation:twinkle var(--d,3s) ease-in-out infinite;
      animation-delay:var(--delay,0s);
    }
    @keyframes twinkle {
      0%,100%{opacity:var(--lo,0.1)} 50%{opacity:var(--hi,0.7)}
    }

    /* ── 戰鬥舞台中間區域 ── */
    #arena {
      flex:1;
      position:relative;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      padding:0 40px 20px;
    }

    /* 地板線 */
    #arena::after {
      content:'';
      position:absolute;
      bottom:18px; left:20px; right:20px;
      height:1px;
      background:linear-gradient(90deg,transparent,rgba(140,185,255,0.2),transparent);
    }

    /* ══════════════ MONSTER ══════════════ */
    #monster-wrap {
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
    }

    /* 怪物圖 */
    #monster-sprite {
      width:110px; height:110px;
      object-fit:contain;
      filter:drop-shadow(0 0 18px rgba(255,80,80,0.35));
      image-rendering:pixelated;
      animation:monsterFloat 3s ease-in-out infinite;
    }
    @keyframes monsterFloat {
      0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)}
    }
    #monster-sprite.hit {
      animation:monsterHit 0.3s ease !important;
    }
    @keyframes monsterHit {
      0%{transform:translateX(0) brightness(1)}
      20%{transform:translateX(12px);filter:brightness(3) drop-shadow(0 0 20px #fff)}
      100%{transform:translateX(0);filter:drop-shadow(0 0 18px rgba(255,80,80,0.35))}
    }
    #monster-no-img {
      width:110px; height:110px;
      display:flex; align-items:center; justify-content:center;
      font-size:64px;
      animation:monsterFloat 3s ease-in-out infinite;
      filter:drop-shadow(0 0 18px rgba(255,80,80,0.3));
    }

    /* 怪物名稱 + HP */
    #monster-info {
      text-align:center;
    }
    #monster-name {
      font-size:16px; font-weight:900;
      color:var(--gold);
      text-shadow:0 0 12px rgba(240,208,128,0.6),1px 1px 4px #000;
      margin-bottom:4px;
    }
    #monster-lv {
      font-size:10px; color:rgba(200,220,255,0.5);
      margin-bottom:5px;
    }
    .hp-bar-outer {
      width:200px; height:10px;
      background:rgba(0,0,0,0.6);
      border:1px solid rgba(255,80,80,0.3);
      position:relative; overflow:hidden;
    }
    .hp-bar-fill {
      height:100%;
      background:linear-gradient(90deg,var(--red2),var(--red),#ff9999);
      transition:width 0.7s cubic-bezier(0.4,0,0.2,1);
    }
    .hp-bar-fill::after {
      content:'';position:absolute;top:0;left:0;right:0;height:40%;
      background:rgba(255,255,255,0.1);
    }
    .hp-text-small {
      font-size:9px; color:rgba(255,255,255,0.6);
      text-align:center; margin-top:2px;
    }

    /* ══════════════ FIGHTERS (左側人物群) ══════════════ */
    #fighters {
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:2px;
      max-width:160px;
    }

    .fighter {
      display:flex;
      align-items:center;
      gap:6px;
      position:relative;
    }

    /* 小人物 CSS sprite */
    .char-sprite {
      width:36px; height:36px;
      border-radius:50%;
      overflow:hidden;
      border:2px solid rgba(140,185,255,0.3);
      flex-shrink:0;
      position:relative;
      background:rgba(0,0,30,0.6);
    }
    .char-sprite img {
      width:100%; height:100%; object-fit:cover;
    }
    .char-sprite .char-emoji {
      width:100%; height:100%;
      display:flex; align-items:center; justify-content:center;
      font-size:18px;
    }
    .fighter.rank-1 .char-sprite { border-color:var(--gold); box-shadow:0 0 8px rgba(240,208,128,0.5); }
    .fighter.rank-2 .char-sprite { border-color:#b0c4d8; }
    .fighter.rank-3 .char-sprite { border-color:#c8895a; }

    /* 攻擊動畫 */
    .fighter.attacking .char-sprite {
      animation:charAttack 0.4s cubic-bezier(0.36,0.07,0.19,0.97);
    }
    @keyframes charAttack {
      0%{transform:translateX(0)}
      40%{transform:translateX(22px) scale(1.1)}
      100%{transform:translateX(0)}
    }

    /* 弓箭手射箭 */
    .fighter.bow-attack .char-sprite {
      animation:bowShoot 0.5s ease;
    }
    @keyframes bowShoot {
      0%{transform:translateX(0) scale(1)}
      30%{transform:translateX(-4px) scale(0.95)}
      60%{transform:translateX(5px) scale(1.05)}
      100%{transform:translateX(0) scale(1)}
    }

    /* 法師詠唱 */
    .fighter.magic-attack .char-sprite {
      animation:magicCast 0.5s ease;
    }
    @keyframes magicCast {
      0%{transform:translateY(0) scale(1)}
      50%{transform:translateY(-8px) scale(1.1);filter:brightness(1.8) drop-shadow(0 0 8px #a8d8ff)}
      100%{transform:translateY(0) scale(1)}
    }

    .fighter-name {
      font-size:12px; font-weight:700;
      color:#c8deff;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      max-width:100px;
      text-shadow:1px 1px 3px rgba(0,0,0,0.9);
    }
    .fighter-dmg {
      font-size:10px; font-weight:700;
      color:var(--red);
      white-space:nowrap;
    }

    /* ══════════════ 飄字傷害數字 ══════════════ */
    .dmg-popup {
      position:absolute;
      font-size:22px; font-weight:900;
      color:#fff;
      text-shadow:0 0 8px rgba(255,150,80,0.9),2px 2px 4px #000;
      pointer-events:none;
      animation:dmgFloat 1.1s ease forwards;
      z-index:20;
      white-space:nowrap;
    }
    .dmg-popup.crit {
      font-size:30px;
      color:var(--gold);
      text-shadow:0 0 12px rgba(255,200,60,0.9),2px 2px 6px #000;
    }
    .dmg-popup.magic {
      color:#a8d8ff;
      text-shadow:0 0 12px rgba(100,180,255,0.9),2px 2px 4px #000;
    }
    @keyframes dmgFloat {
      0%   {opacity:1;transform:translateY(0) scale(0.8)}
      20%  {transform:translateY(-20px) scale(1.2)}
      80%  {opacity:1;transform:translateY(-55px) scale(1)}
      100% {opacity:0;transform:translateY(-70px) scale(0.9)}
    }

    /* 箭矢飛行 */
    .arrow {
      position:absolute;
      width:20px; height:3px;
      background:linear-gradient(90deg,transparent,#f0d080,#fff);
      border-radius:2px;
      pointer-events:none;
      animation:arrowFly 0.4s ease forwards;
      z-index:15;
    }
    @keyframes arrowFly {
      0%  {opacity:1;transform:translateX(0)}
      100%{opacity:0;transform:translateX(140px)}
    }

    /* 魔法彈 */
    .magic-orb {
      position:absolute;
      width:12px; height:12px;
      border-radius:50%;
      background:radial-gradient(circle,#fff,#a8d8ff,#4a90c8);
      box-shadow:0 0 10px #a8d8ff;
      pointer-events:none;
      animation:orbFly 0.45s ease forwards;
      z-index:15;
    }
    @keyframes orbFly {
      0%  {opacity:1;transform:translate(0,0) scale(1)}
      80% {opacity:1;transform:translate(130px,-10px) scale(0.7)}
      100%{opacity:0;transform:translate(150px,-12px) scale(0)}
    }

    /* 撞擊閃光 */
    .impact {
      position:absolute;
      width:50px; height:50px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,0.9),rgba(255,200,80,0.5),transparent);
      pointer-events:none;
      animation:impactAnim 0.35s ease forwards;
      z-index:18;
    }
    @keyframes impactAnim {
      0%  {opacity:1;transform:scale(0.3)}
      50% {transform:scale(1.4)}
      100%{opacity:0;transform:scale(1.8)}
    }

    /* ══════════════ LEADERBOARD PANEL ══════════════ */
    #side-left, #side-right {
      display:flex; flex-direction:column; gap:6px;
    }

    .panel {
      background:var(--panel);
      border:1px solid var(--border);
      border-left:2px solid rgba(140,185,255,0.4);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      padding:8px 12px;
      position:relative;
      clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));
    }
    .panel-title {
      font-size:10px; letter-spacing:2px;
      color:var(--ice2); margin-bottom:6px;
      display:flex; align-items:center; gap:5px;
    }
    .panel-title::before {
      content:''; display:inline-block;
      width:2px; height:10px; background:var(--ice2);
    }

    /* 排行列 */
    .rank-row {
      display:flex; align-items:center; gap:6px;
      padding:3px 0;
      border-bottom:1px solid rgba(140,185,255,0.06);
      animation:fadeIn 0.3s ease;
    }
    @keyframes fadeIn{from{opacity:0;transform:translateX(-4px)}to{opacity:1;transform:none}}
    .rank-num {
      width:16px; font-size:11px; font-weight:700;
      text-align:center; color:rgba(200,220,255,0.35); flex-shrink:0;
    }
    .rank-row:nth-child(1) .rank-num{color:var(--gold)}
    .rank-row:nth-child(2) .rank-num{color:#b0c4d8}
    .rank-row:nth-child(3) .rank-num{color:#c8895a}
    .rank-avatar-sm {
      width:22px; height:22px; border-radius:50%;
      overflow:hidden; flex-shrink:0;
      border:1px solid var(--border);
      background:rgba(0,0,30,0.5);
      display:flex; align-items:center; justify-content:center;
      font-size:11px;
    }
    .rank-avatar-sm img{width:100%;height:100%;object-fit:cover}
    .rank-name-sm {
      flex:1; font-size:12px; font-weight:700; color:#c8deff;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      text-shadow:1px 1px 3px rgba(0,0,0,0.8);
    }
    .rank-dmg-sm {
      font-size:12px; font-weight:900; color:var(--red);
      text-shadow:0 0 6px rgba(255,80,80,0.4),1px 1px 3px #000;
      white-space:nowrap;
    }

    /* 怪物資訊小卡 */
    .monster-card {
      font-size:11px;
      color:rgba(200,220,255,0.55);
      line-height:1.8;
    }
    .monster-card b { color:var(--gold); font-weight:700; }

    /* ══════════════ FOOTER ══════════════ */
    #footer {
      grid-column:1/-1;
      display:flex; align-items:center; justify-content:space-between;
      font-size:9px; color:rgba(200,220,255,0.25);
      padding:0 4px;
    }
    #ws-dot {
      width:5px; height:5px; border-radius:50%;
      background:#888; display:inline-block; margin-right:4px;
      transition:background 0.4s;
    }
    #ws-dot.on {background:#50fa7b;box-shadow:0 0 5px #50fa7b}
    #ws-dot.off{background:#ff5555}
  </style>
</head>
<body>
<div id="root">

  <!-- Zone 切換 Tab -->
  <div id="zone-tabs">
    <div class="zone-tab active" data-zone="normal" onclick="switchZone('normal')">⚔ 一般區</div>
    <div class="zone-tab"        data-zone="mid"    onclick="switchZone('mid')">💀 中級區</div>
  </div>

  <!-- 左側：怪物資訊 + 傷害排行 -->
  <div id="side-left">
    <div class="panel">
      <div class="panel-title">目標情報</div>
      <div class="monster-card" id="monster-card">讀取中…</div>
    </div>
    <div class="panel" style="flex:1">
      <div class="panel-title">傷害排行</div>
      <div id="leaderboard-list"></div>
    </div>
  </div>

  <!-- 中央：戰鬥舞台 -->
  <div id="battle-stage">
    <div id="stars"></div>
    <div id="arena">
      <!-- 左：戰士列 -->
      <div id="fighters"></div>
      <!-- 右：怪物 -->
      <div id="monster-wrap">
        <div id="monster-no-img">👾</div>
        <img id="monster-sprite" src="" alt="" style="display:none">
        <div id="monster-info">
          <div id="monster-name">讀取中…</div>
          <div id="monster-lv"></div>
          <div class="hp-bar-outer">
            <div class="hp-bar-fill" id="hp-bar" style="width:100%"></div>
          </div>
          <div class="hp-text-small" id="hp-text">－</div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer">
    <span><span id="ws-dot"></span>每 3 秒更新</span>
    <span id="refresh-time"></span>
  </div>

</div>
<script>
const API     = 'http://127.0.0.1:5566';
const POLL_MS = 3000;

let currentZone = 'normal';
let zonesData   = [];
let animQueue   = [];
let animRunning = false;
let lastLeaderboard = [];
let roundMs = 560; // 預設值，從 API 取得後覆寫

// ── 星星背景 ──
(function makeStars(){
  const c = document.getElementById('stars');
  for(let i=0;i<60;i++){
    const s=document.createElement('div');
    s.className='star';
    const sz=Math.random()*2+0.5;
    s.style.cssText=`
      left:${Math.random()*100}%;top:${Math.random()*100}%;
      width:${sz}px;height:${sz}px;
      --d:${(Math.random()*3+2).toFixed(1)}s;
      --delay:${(Math.random()*4).toFixed(1)}s;
      --lo:${(Math.random()*0.15).toFixed(2)};
      --hi:${(Math.random()*0.5+0.3).toFixed(2)};
    `;
    c.appendChild(s);
  }
})();

// ── 格式化數字 ──
function fmt(n){
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=1000)    return (n/1000).toFixed(1)+'K';
  return String(n);
}

// ── 武器 → emoji + 攻擊動畫 class ──
function weaponEmoji(wt){
  const m={sword_1h:'⚔',sword_2h:'🗡',dagger:'🔪',staff_1h:'🪄',staff_2h:'✨',bow:'🏹',dice:'🎲'};
  return m[wt]||'⚔';
}
function attackClass(wt){
  if(!wt) return 'attacking';
  if(wt.startsWith('staff')||wt==='dice') return 'magic-attack';
  if(wt==='bow') return 'bow-attack';
  return 'attacking';
}

// ── Zone 切換 ──
function switchZone(z){
  currentZone=z;
  document.querySelectorAll('.zone-tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.zone===z);
  });
  const zone=zonesData.find(d=>d.zone===z);
  if(zone) renderZone(zone);
}

// ── 渲染怪物 ──
function renderMonster(zone){
  document.getElementById('monster-name').textContent = zone.monsterName||'無怪物';
  document.getElementById('monster-lv').textContent   = zone.monsterLevel ? `Lv.${zone.monsterLevel}` : '';

  const pct  = zone.maxHp>0 ? Math.max(0,(zone.currentHp/zone.maxHp)*100) : 0;
  document.getElementById('hp-bar').style.width = pct.toFixed(1)+'%';
  document.getElementById('hp-text').textContent = `${fmt(zone.currentHp)} / ${fmt(zone.maxHp)}`;

  const sprite = document.getElementById('monster-sprite');
  const noImg  = document.getElementById('monster-no-img');
  if(zone.monsterImageUrl){
    sprite.src=zone.monsterImageUrl; sprite.style.display='block'; noImg.style.display='none';
    sprite.onerror=()=>{sprite.style.display='none';noImg.style.display='flex'};
  } else {
    sprite.style.display='none'; noImg.style.display='flex';
  }

  // 怪物情報卡
  document.getElementById('monster-card').innerHTML=`
    <b>${zone.monsterName||'?'}</b><br>
    等級：${zone.monsterLevel||'?'}　參戰：${zone.participantCount||0} 人<br>
    獎勵：<b>${zone.goldReward||0}</b> G　/ <b>${zone.expReward||0}</b> EXP<br>
    ${zone.drops?.length ? '掉落：'+zone.drops.slice(0,3).join('、') : ''}
  `;
}

// ── 渲染傷害排行（左側） ──
function renderLeaderboard(lb){
  const el=document.getElementById('leaderboard-list');
  if(!lb||!lb.length){el.innerHTML='<div style="color:rgba(200,220,255,0.2);font-size:12px;padding:8px 0">尚無資料</div>';return;}
  el.innerHTML='';
  lb.slice(0,8).forEach((e,i)=>{
    const row=document.createElement('div');
    row.className='rank-row';
    row.innerHTML=`
      <span class="rank-num">${i+1}</span>
      <div class="rank-avatar-sm">
        ${e.avatarUrl?`<img src="${e.avatarUrl}" onerror="this.parentNode.innerHTML='${weaponEmoji(e.weaponType)}'">`:weaponEmoji(e.weaponType)}
      </div>
      <span class="rank-name-sm">${e.name}</span>
      <span class="rank-dmg-sm">${fmt(e.damage)}</span>
    `;
    el.appendChild(row);
  });
}

// ── 渲染戰士列（舞台左側小人） ──
function renderFighters(lb){
  const el=document.getElementById('fighters');
  el.innerHTML='';
  lb.slice(0,6).forEach((e,i)=>{
    const f=document.createElement('div');
    f.className=`fighter rank-${i+1}`;
    f.dataset.id=e.discordId;
    f.dataset.wt=e.weaponType||'';
    f.innerHTML=`
      <div class="char-sprite">
        ${e.avatarUrl?`<img src="${e.avatarUrl}" onerror="this.innerHTML='${weaponEmoji(e.weaponType)}'">`:
          `<div class="char-emoji">${weaponEmoji(e.weaponType)}</div>`}
      </div>
      <div>
        <div class="fighter-name">${e.name}</div>
        <div class="fighter-dmg">${fmt(e.damage)} dmg</div>
      </div>
    `;
    el.appendChild(f);
  });
}

// ── 渲染整個 zone ──
function renderZone(zone){
  renderMonster(zone);
  const lb=zone.damageLeaderboard||[];
  renderLeaderboard(lb);
  renderFighters(lb);
}

// ═══════════════════════════════════
//  攻擊動畫系統
// ═══════════════════════════════════
const arena = document.getElementById('arena');

function spawnDmgPopup(dmg, wt){
  const el=document.createElement('div');
  el.className='dmg-popup'+(wt?.startsWith('staff')||wt==='dice'?' magic':'');
  el.textContent=fmt(dmg);
  // 隨機位置在怪物附近
  el.style.right  = (50+Math.random()*40-20)+'px';
  el.style.bottom = (100+Math.random()*60)+'px';
  arena.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}

function spawnArrow(fighterEl){
  const rect=fighterEl.getBoundingClientRect();
  const aRect=arena.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='arrow';
  el.style.left=(rect.right-aRect.left)+'px';
  el.style.top =(rect.top -aRect.top+15)+'px';
  arena.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}

function spawnOrb(fighterEl){
  const rect=fighterEl.getBoundingClientRect();
  const aRect=arena.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='magic-orb';
  el.style.left=(rect.right-aRect.left)+'px';
  el.style.top =(rect.top -aRect.top+10)+'px';
  arena.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}

function spawnImpact(){
  const monsterWrap=document.getElementById('monster-wrap');
  const rect=monsterWrap.getBoundingClientRect();
  const aRect=arena.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='impact';
  el.style.left=(rect.left-aRect.left+rect.width/2-25)+'px';
  el.style.top =(rect.top -aRect.top+30)+'px';
  arena.appendChild(el);
  el.addEventListener('animationend',()=>el.remove());
}

function monsterHitAnim(){
  const s=document.getElementById('monster-sprite');
  const n=document.getElementById('monster-no-img');
  const target=s.style.display!=='none'?s:n;
  target.classList.remove('hit');
  void target.offsetWidth;
  target.classList.add('hit');
  target.addEventListener('animationend',()=>target.classList.remove('hit'),{once:true});
}

// 執行單次攻擊動畫
function playAttack(entry){
  const fighters = document.querySelectorAll('.fighter');
  // 找對應的小人（或隨機一個）
  let fighterEl = [...fighters].find(f=>f.dataset.id===entry.discordId);
  if(!fighterEl && fighters.length) fighterEl=fighters[Math.floor(Math.random()*fighters.length)];
  if(!fighterEl) return;

  const wt=fighterEl.dataset.wt||'';
  const cls=attackClass(wt);

  // 攻擊動畫
  fighterEl.classList.add(cls);
  fighterEl.addEventListener('animationend',()=>fighterEl.classList.remove(cls),{once:true});

  // 依武器類型播放效果
  setTimeout(()=>{
    if(wt==='bow')          spawnArrow(fighterEl);
    else if(wt.startsWith('staff')||wt==='dice') spawnOrb(fighterEl);
  }, 80);

  setTimeout(()=>{
    spawnImpact();
    monsterHitAnim();
    spawnDmgPopup(entry.fakeDmg||0, wt);
  }, wt==='bow'||wt.startsWith('staff')||wt==='dice' ? 420 : 320);
}

// 動畫佇列執行 — 間隔跟 roundMs 同步
function runQueue(){
  if(animRunning||animQueue.length===0){animRunning=false;return;}
  animRunning=true;
  const entry=animQueue.shift();
  playAttack(entry);
  setTimeout(runQueue, roundMs);
}

// 比較前後排行，對有傷害增量的人觸發攻擊
function triggerAttacks(newLb){
  if(!lastLeaderboard.length){lastLeaderboard=newLb;return;}
  const oldMap={};
  lastLeaderboard.forEach(e=>oldMap[e.discordId]=e.damage);

  newLb.forEach(e=>{
    const diff=(e.damage||0)-(oldMap[e.discordId]||0);
    if(diff>0) animQueue.push({...e, fakeDmg:diff});
  });
  lastLeaderboard=newLb;
  if(!animRunning) runQueue();
}

// 沒有新攻擊時以 roundMs 間隔自動播假動畫保持生動
let idleTimer=null;
function resetIdleTimer(lb){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{
    if(!lb.length) return;
    const e={...lb[Math.floor(Math.random()*Math.min(lb.length,3))], fakeDmg:0};
    animQueue.push(e);
    if(!animRunning) runQueue();
    resetIdleTimer(lb);
  }, roundMs * 2);
}

// ═══════════════════════════════════
//  Polling
// ═══════════════════════════════════
const dot    = document.getElementById('ws-dot');
const timeEl = document.getElementById('refresh-time');

async function fetchSnapshot(){
  try{
    const r=await fetch(`${API}/api/viewer/snapshot`);
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    zonesData=j.data?.zones||[];
    if(j.data?.roundMs) roundMs = j.data.roundMs; // 跟後端回合速度同步

    const zone=zonesData.find(d=>d.zone===currentZone)||zonesData[0];
    if(zone){
      renderZone(zone);
      triggerAttacks(zone.damageLeaderboard||[]);
      resetIdleTimer(zone.damageLeaderboard||[]);
    }

    dot.className='on';
    const now=new Date();
    timeEl.textContent=`${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')} 更新`;
  }catch(_){
    dot.className='off';
  }
}

fetchSnapshot();
setInterval(fetchSnapshot, POLL_MS);
</script>
