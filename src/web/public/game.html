<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色裝備視窗</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #2c2c2c;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            font-size: 12px;
            color: #fff;
            user-select: none;
        }

        .equipment-window {
            width: 480px;
            margin: 0 auto;
            background: linear-gradient(to bottom, #4a4a4a 0%, #3a3a3a 50%, #2a2a2a 100%);
            border: 2px outset #666;
        }

        .window-title {
            background: linear-gradient(to bottom, #5a7db5 0%, #4a6da5 50%, #3a5d95 100%);
            padding: 4px 8px;
            border: 1px outset #666;
            border-bottom: 1px solid #333;
            color: #fff;
            font-weight: bold;
            text-align: center;
        }

        .window-content {
            padding: 10px;
            display: flex;
            gap: 10px;
        }

        .equipment-slots,
        .stats-panel,
        .character-area {
            background: #404040;
            border: 1px inset #666;
        }

        .equipment-slots,
        .stats-panel {
            width: 140px;
            padding: 5px;
        }

        .character-area {
            width: 180px;
            text-align: center;
            padding: 10px;
        }

        .equipment-slot,
        .stat-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 4px;
            margin-bottom: 1px;
            background: #505050;
            border: 1px solid #333;
            min-height: 20px;
        }

        .equipment-slot:hover {
            background: #606060;
        }

        .slot-label {
            width: 60px;
            color: #ccc;
            font-size: 11px;
        }

        .slot-item {
            flex: 1;
            color: #fff;
            font-size: 10px;
            text-align: left;
        }

        .character-name {
            font-size: 14px;
            font-weight: bold;
            color: #ffff99;
            margin-bottom: 5px;
        }

        .character-avatar {
            width: 80px;
            height: 80px;
            margin: 10px auto;
            border-radius: 50%;
            border: 2px solid #666;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .character-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .character-info {
            font-size: 10px;
            color: #ccc;
            margin-top: 5px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 2px 0;
            background: rgba(0, 0, 0, 0.3);
            padding: 1px 4px;
        }

        .stats-title {
            text-align: center;
            font-weight: bold;
            color: #ffff99;
            margin-bottom: 5px;
            font-size: 11px;
        }

        .stat-label {
            color: #ccc;
            width: 35px;
            text-align: left;
            font-size: 10px;
        }

        .stat-value {
            color: #fff;
            text-align: right;
            flex: 1;
            font-size: 10px;
        }

        .separator {
            height: 1px;
            background: #666;
            margin: 5px 0;
        }

        .button-area {
            margin: 10px 0;
            text-align: center;
            padding-bottom: 10px;
        }

        .classic-button {
            background: linear-gradient(to bottom, #666 0%, #555 50%, #444 100%);
            border: 2px outset #777;
            color: #fff;
            padding: 6px 16px;
            margin: 0 5px;
            font-size: 11px;
            cursor: pointer;
            font-family: inherit;
        }

        .classic-button:hover {
            background: linear-gradient(to bottom, #777 0%, #666 50%, #555 100%);
        }

        .classic-button:active {
            border: 2px inset #777;
            background: linear-gradient(to bottom, #555 0%, #444 50%, #333 100%);
        }

        .loading,
        .error {
            text-align: center;
            padding: 50px;
        }

        .error {
            color: #ff6666;
        }

        .rarity-common { color: #cccccc; }
        .rarity-uncommon { color: #1eff00; }
        .rarity-rare { color: #0070dd; }
        .rarity-epic { color: #a335ee; }
        .rarity-legendary { color: #ff8000; }

        .message-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10000;
            border: 2px solid #444;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            max-width: 320px;
            text-align: center;
            word-break: break-word;
        }

        @media (max-width: 560px) {
            body {
                padding: 8px;
            }

            .equipment-window {
                width: 100%;
            }

            .window-content {
                flex-direction: column;
            }

            .equipment-slots,
            .stats-panel,
            .character-area {
                width: auto;
            }
        }
    </style>
</head>
<body>
    <div class="equipment-window">
        <div class="window-title">角色裝備視窗</div>

        <div id="loading-container" class="loading">載入中...</div>
        <div id="error-container" class="error" style="display: none;">載入失敗</div>

        <div id="game-container" style="display: none;">
            <div class="window-content">
                <div class="equipment-slots">
                    <div class="equipment-slot"><span class="slot-label">頭 上:</span><span class="slot-item" id="slot-helmet">未裝備</span></div>
                    <div class="equipment-slot"><span class="slot-label">頭 中:</span><span class="slot-item" id="slot-helmet2">未裝備</span></div>
                    <div class="equipment-slot"><span class="slot-label">右 手:</span><span class="slot-item" id="slot-weapon">未裝備</span></div>
                    <div class="equipment-slot"><span class="slot-label">身 體:</span><span class="slot-item" id="slot-armor">未裝備</span></div>
                    <div class="equipment-slot"><span class="slot-label">左 手:</span><span class="slot-item" id="slot-shield">未裝備</span></div>
                    <div class="equipment-slot"><span class="slot-label">披 風:</span><span class="slot-item" id="slot-cloak">未裝備</span></div>
                    <div class="equipment-slot"><span class="slot-label">鞋 子:</span><span class="slot-item" id="slot-boots">未裝備</span></div>
                    <div class="equipment-slot"><span class="slot-label">飾品1:</span><span class="slot-item" id="slot-accessory">未裝備</span></div>
                    <div class="equipment-slot"><span class="slot-label">飾品2:</span><span class="slot-item" id="slot-accessory2">未裝備</span></div>
                </div>

                <div class="character-area">
                    <div class="character-name" id="character-name">Loading...</div>
                    <div class="character-avatar">
                        <img id="character-avatar" src="" alt="角色頭像" style="display: none;">
                        <div id="avatar-placeholder" style="color: #666; font-size: 10px;">頭像</div>
                    </div>
                    <div class="character-info">
                        <div class="info-row"><span>等級:</span><span id="character-level">-</span></div>
                        <div class="info-row"><span>金幣:</span><span id="character-gold">-</span></div>
                        <div class="info-row"><span>經驗:</span><span id="character-exp">-/-</span></div>
                        <div class="info-row"><span>戰力:</span><span id="character-power" style="color: #ffff99;">-</span></div>
                    </div>
                </div>

                <div class="stats-panel">
                    <div class="stats-title">角色數值</div>
                    <div class="separator"></div>
                    <div class="stat-row"><span class="stat-label">Str</span><span class="stat-value" id="stat-str">-</span></div>
                    <div class="stat-row"><span class="stat-label">Agi</span><span class="stat-value" id="stat-agi">-</span></div>
                    <div class="stat-row"><span class="stat-label">Vit</span><span class="stat-value" id="stat-vit">-</span></div>
                    <div class="stat-row"><span class="stat-label">Int</span><span class="stat-value" id="stat-int">-</span></div>
                    <div class="stat-row"><span class="stat-label">Dex</span><span class="stat-value" id="stat-dex">-</span></div>
                    <div class="stat-row"><span class="stat-label">Luk</span><span class="stat-value" id="stat-luk">-</span></div>
                    <div class="separator"></div>
                    <div class="stat-row"><span class="stat-label">Atk</span><span class="stat-value" id="stat-atk">-</span></div>
                    <div class="stat-row"><span class="stat-label">Def</span><span class="stat-value" id="stat-def">-</span></div>
                    <div class="stat-row"><span class="stat-label">Matk</span><span class="stat-value" id="stat-matk">-</span></div>
                    <div class="stat-row"><span class="stat-label">Mdef</span><span class="stat-value" id="stat-mdef">-</span></div>
                    <div class="stat-row"><span class="stat-label">Hit</span><span class="stat-value" id="stat-hit">-</span></div>
                    <div class="stat-row"><span class="stat-label">Flee</span><span class="stat-value" id="stat-flee">-</span></div>
                    <div class="stat-row"><span class="stat-label">Aspd</span><span class="stat-value" id="stat-aspd">-</span></div>
                </div>
            </div>

            <div class="button-area">
                <button class="classic-button" type="button" id="btn-open-chest">開寶箱</button>
                <button class="classic-button" type="button" id="btn-refresh">重新載入</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = "";
        let gameData = null;

        function getSessionId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get("session") || "";
        }

        function showMessage(message, type) {
            document.querySelectorAll(".message-popup").forEach((el) => el.remove());

            const popup = document.createElement("div");
            popup.className = "message-popup";
            popup.textContent = message;

            if (type === "error") {
                popup.style.background = "rgba(200, 0, 0, 0.9)";
            } else if (type === "info") {
                popup.style.background = "rgba(0, 100, 220, 0.9)";
            } else {
                popup.style.background = "rgba(0, 130, 0, 0.9)";
            }

            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 2500);
        }

        function setLoadingState() {
            document.getElementById("loading-container").style.display = "block";
            document.getElementById("error-container").style.display = "none";
            document.getElementById("game-container").style.display = "none";
        }

        function setErrorState(message) {
            const err = document.getElementById("error-container");
            document.getElementById("loading-container").style.display = "none";
            document.getElementById("game-container").style.display = "none";
            err.style.display = "block";
            err.textContent = message;
        }

        function setReadyState() {
            document.getElementById("loading-container").style.display = "none";
            document.getElementById("error-container").style.display = "none";
            document.getElementById("game-container").style.display = "block";
        }

        function updateEquipmentSlot(slotId, item) {
            const element = document.getElementById(slotId);
            if (!element) return;

            if (!item) {
                element.textContent = "未裝備";
                element.className = "slot-item";
                element.title = "";
                return;
            }

            const stats = item.stats || {};
            element.textContent = item.name || "未知裝備";
            element.className = "slot-item rarity-" + (item.rarity || "common");
            element.title = (item.name || "未知裝備") + "\n攻擊: " + (stats.atk || 0) + "\n防禦: " + (stats.def || 0) + "\n生命: " + (stats.hp || 0);
        }

        function updateUI() {
            if (!gameData || !gameData.user) return;

            const user = gameData.user;
            const equipped = user.equipped || {};
            const statusRows = Array.isArray(gameData.statusRows) ? gameData.statusRows : [];

            document.getElementById("character-name").textContent = user.name || "Unknown";
            document.getElementById("character-level").textContent = user.level || 1;
            document.getElementById("character-gold").textContent = user.gold || 0;
            document.getElementById("character-exp").textContent = (user.exp || 0) + "/" + (user.nextExp || 100);
            document.getElementById("character-power").textContent = gameData.power || 0;

            const avatarUrl = (gameData.session && gameData.session.avatarUrl)
                ? gameData.session.avatarUrl
                : (gameData.avatarUrl || "");
            const avatarImg = document.getElementById("character-avatar");
            const avatarPlaceholder = document.getElementById("avatar-placeholder");
            if (avatarUrl) {
                avatarImg.src = avatarUrl;
                avatarImg.style.display = "block";
                avatarPlaceholder.style.display = "none";
            } else {
                avatarImg.style.display = "none";
                avatarPlaceholder.style.display = "block";
            }

            updateEquipmentSlot("slot-helmet", equipped.helmet);
            updateEquipmentSlot("slot-helmet2", equipped.helmet2);
            updateEquipmentSlot("slot-weapon", equipped.weapon);
            updateEquipmentSlot("slot-armor", equipped.armor);
            updateEquipmentSlot("slot-shield", equipped.shield);
            updateEquipmentSlot("slot-cloak", equipped.cloak);
            updateEquipmentSlot("slot-boots", equipped.boots);
            updateEquipmentSlot("slot-accessory", equipped.accessory);
            updateEquipmentSlot("slot-accessory2", equipped.accessory2);

            statusRows.forEach((row) => {
                if (row.leftLabel) {
                    const left = document.getElementById("stat-" + String(row.leftLabel).toLowerCase());
                    if (left) left.textContent = row.leftValue || "-";
                }
                if (row.rightLabel) {
                    const right = document.getElementById("stat-" + String(row.rightLabel).toLowerCase());
                    if (right) right.textContent = row.rightValue || "-";
                }
            });
        }

        async function loadGameData() {
            const response = await fetch("/api/game-data/" + encodeURIComponent(sessionId));
            if (!response.ok) {
                throw new Error("載入失敗 (" + response.status + ")");
            }
            gameData = await response.json();
            updateUI();
            setReadyState();
        }

        async function openChest() {
            try {
                showMessage("正在開啟寶箱...", "info");
                const response = await fetch("/api/session/" + encodeURIComponent(sessionId) + "/open-chest", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                });
                if (!response.ok) {
                    throw new Error("開箱失敗 (" + response.status + ")");
                }
                const result = await response.json();
                if (result.success) {
                    showMessage(result.message || "開寶箱成功");
                    await loadGameData();
                } else {
                    showMessage(result.message || "開寶箱失敗", "error");
                }
            } catch (error) {
                showMessage(error.message || "開寶箱失敗", "error");
            }
        }

        async function refreshPanel() {
            try {
                showMessage("重新載入中...", "info");
                const response = await fetch("/api/session/" + encodeURIComponent(sessionId) + "/reload", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                });
                if (!response.ok) {
                    throw new Error("重新載入失敗 (" + response.status + ")");
                }
                gameData = await response.json();
                updateUI();
                setReadyState();
                showMessage("載入完成");
            } catch (error) {
                showMessage(error.message || "重新載入失敗", "error");
            }
        }

        async function init() {
            sessionId = getSessionId();
            if (!sessionId) {
                setErrorState("無效連結: 缺少 session 參數");
                return;
            }

            setLoadingState();
            try {
                await loadGameData();
            } catch (error) {
                setErrorState(error.message || "載入失敗");
            }

            document.getElementById("btn-open-chest").addEventListener("click", openChest);
            document.getElementById("btn-refresh").addEventListener("click", refreshPanel);
        }

        window.addEventListener("load", init);
    </script>
</body>
</html>
