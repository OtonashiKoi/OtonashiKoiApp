<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>equipmentGAME · 冒險大廳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<!--
  ============================================================
  Web 客戶端（正式版殼）— 目標：完全比照 Discord 功能
  ------------------------------------------------------------
  P1 地基：登入(mock 捷徑) + Hub 大廳 + 全功能導航 + 角色資料頁(真 API)
  後續階段：P2 養成 / P3 戰鬥 / P4 經濟社交 / P5 補洞(爬塔/PK/賭場/寵物/個人房間)

  資料：直接接正式機 API（同源）。token 存 localStorage。
        登入用 mock 捷徑 POST /api/auth/discord {code:"mock:<id>"}。
  ============================================================
-->
<style>
  :root{
    --bg-0:#0a0710;--bg-1:#160f24;--bg-2:#241636;
    --gold:#f4c66a;--ink:#efe7ff;--ink-dim:#a596c4;
    --hp:#43d17a;--mp:#5aa9ff;--exp:#f4c66a;
    --str:#ff7a6b;--agi:#5dffa0;--vit:#ffd166;--int:#7cc4ff;--dex:#b388ff;--luk:#ff9ed8;
    --panel:rgba(20,12,32,.72);--line:rgba(244,198,106,.24);--line-soft:rgba(255,255,255,.08);
    --font-title:"Cinzel","Noto Serif TC",serif;
    --font-body:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font-body);color:var(--ink);min-height:100vh;background-color:var(--bg-0);
    background-image:
      radial-gradient(140% 105% at 50% 50%, transparent 58%, rgba(0,0,0,.55) 100%),
      radial-gradient(900px 520px at 50% -8%, rgba(244,198,106,.10), transparent 60%),
      radial-gradient(760px 620px at 100% 2%, rgba(124,58,237,.18), transparent 55%),
      radial-gradient(720px 620px at 0% 14%, rgba(90,60,140,.16), transparent 55%);
    background-attachment:fixed}
  .scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .btn{cursor:pointer;border:1px solid var(--line);color:var(--ink);
    background:linear-gradient(180deg,rgba(40,26,60,.85),rgba(18,11,28,.9));
    border-radius:10px;padding:9px 16px;font-size:14px;transition:.15s;font-family:var(--font-body);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.35)}
  .btn:hover{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 1px rgba(244,198,106,.35),0 4px 16px rgba(244,198,106,.16)}
  .btn.primary{background:linear-gradient(180deg,#ffe6a6,#f4c66a 42%,#c89a40);color:#2a1900;border-color:transparent;font-weight:700;
    text-shadow:0 1px 0 rgba(255,255,255,.3);box-shadow:0 2px 0 #7d5f20,0 7px 18px rgba(244,198,106,.32),inset 0 1px 0 rgba(255,255,255,.6)}
  .btn.primary:hover{filter:brightness(1.06);color:#2a1900;transform:translateY(-1px);box-shadow:0 2px 0 #7d5f20,0 10px 24px rgba(244,198,106,.42),inset 0 1px 0 rgba(255,255,255,.6)}
  .h-title{font-family:var(--font-title);letter-spacing:1.5px}

  /* ── 登入 ── */
  #login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    background:radial-gradient(900px 600px at 50% 0%,#241636,var(--bg-0));transition:opacity .4s}
  #login.hide{opacity:0;pointer-events:none}
  .login-card{width:min(420px,92vw);border:1px solid var(--line);border-radius:18px;
    background:var(--panel);padding:32px 28px;text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .login-card .logo{font-size:52px}
  .login-card h1{font-family:var(--font-title);font-size:24px;letter-spacing:2px;margin:6px 0 4px}
  .login-card p{color:var(--ink-dim);font-size:13px;margin-bottom:22px}
  .login-card input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);
    background:rgba(0,0,0,.35);color:var(--ink);font-size:14px;margin-bottom:10px;text-align:center}
  .login-card .btn{width:100%;margin-top:6px}
  .login-card .hint{margin-top:16px;font-size:11px;color:var(--ink-dim);line-height:1.6}
  .err{color:#ff8a8a;font-size:12px;min-height:16px;margin-top:8px}

  /* ── App 版面 ── */
  #app{display:none;height:100vh;height:100dvh;max-width:1040px;margin:0 auto;
    grid-template-rows:auto auto 1fr auto;grid-template-areas:"top" "sub" "main" "tabbar"}
  #app.ready{display:grid}
  /* ── 子分頁列（同一主分頁內切換）── */
  .subnav{grid-area:sub;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:9px 16px;border-bottom:1px solid var(--line-soft)}
  .subnav:empty{display:none}
  .subnav::-webkit-scrollbar{display:none}
  .subtab{flex:none;cursor:pointer;border:1px solid var(--line-soft);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink-dim);background:rgba(0,0,0,.2);white-space:nowrap;transition:.15s}
  .subtab:hover{color:var(--ink)}
  .subtab.active{color:var(--gold);border-color:var(--gold);background:rgba(244,198,106,.12);box-shadow:0 0 12px rgba(244,198,106,.15)}
  /* ── 底部主分頁列（手遊式）── */
  .tabbar{grid-area:tabbar;display:flex;justify-content:space-around;align-items:stretch;gap:4px;
    border-top:1px solid var(--line);background:linear-gradient(180deg,rgba(22,14,34,.96),rgba(10,7,16,.99));
    padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.45)}
  .tab-item{flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
    padding:8px 4px;border-radius:14px;color:var(--ink-dim);font-size:11px;transition:.15s}
  .tab-item .ti-ic{font-size:23px;line-height:1;filter:grayscale(.35)}
  .tab-item:hover{color:var(--ink);background:rgba(255,255,255,.04)}
  .tab-item.active{color:var(--gold)}
  .tab-item.active .ti-ic{filter:drop-shadow(0 0 9px rgba(244,198,106,.65))}

  .topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;border-bottom:1px solid var(--line-soft)}
  .topbar .sec-name{font-family:var(--font-title);letter-spacing:1.5px;font-size:17px;white-space:nowrap;flex:0 0 auto}
  .wallet{display:flex;gap:9px;align-items:center}
  .chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:var(--panel)}
  .chip.gold{color:var(--gold)}.chip.dia{color:#7cc4ff}
  .me{display:flex;align-items:center;gap:9px;cursor:pointer}
  .me img,.me .av{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);object-fit:cover;
    display:grid;place-items:center;font-size:18px;background:#1a1230}
  .me{position:relative}
  .me .nm b{font-size:13px}.me .nm span{display:block;font-size:11px;color:var(--ink-dim)}
  .me-menu{position:absolute;top:48px;right:0;z-index:40;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:6px;min-width:130px;display:none;box-shadow:0 12px 30px rgba(0,0,0,.55);backdrop-filter:blur(8px)}
  .me-menu.show{display:block}
  .mm-item{padding:9px 12px;border-radius:8px;cursor:pointer;font-size:14px}
  .mm-item:hover{background:rgba(255,255,255,.06);color:var(--gold)}

  main{grid-area:main;overflow-y:auto;padding:22px 26px}
  /* 詳情/單欄頁的舒適閱讀寬度（置中，避免桌機寬版內容被拉滿） */
  .narrow{max-width:560px;margin-left:auto;margin-right:auto}

  /* ── 角色頁 ── */
  .hero{position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;
    border:1px solid var(--line);border-radius:18px;padding:24px 26px;
    background:
      radial-gradient(620px 260px at 14% -10%,rgba(124,58,237,.28),transparent 60%),
      radial-gradient(520px 240px at 100% 120%,rgba(244,198,106,.12),transparent 60%),
      linear-gradient(160deg,rgba(244,198,106,.10),rgba(10,7,16,.55));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 16px 44px rgba(0,0,0,.5)}
  .hero .pic{position:relative;width:120px;height:120px;border-radius:20px;object-fit:cover;
    display:grid;place-items:center;font-size:56px;
    background:radial-gradient(circle at 50% 32%,rgba(94,169,255,.3),#0a0710 70%);
    box-shadow:0 0 0 2px var(--gold),0 0 0 6px rgba(244,198,106,.12),0 0 26px rgba(244,198,106,.3),inset 0 0 28px rgba(0,0,0,.55)}
  .hero .nm{font-family:var(--font-title);font-size:26px;letter-spacing:1px}
  .hero .tags{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .tag{font-size:12px;border:1px solid var(--line);border-radius:7px;padding:4px 11px;color:var(--ink-dim);
    background:rgba(0,0,0,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
  .tag.job{color:var(--gold);border-color:rgba(244,198,106,.5);box-shadow:0 0 12px rgba(244,198,106,.18),inset 0 1px 0 rgba(255,255,255,.06)}
  .tag.tier{color:#7cc4ff;border-color:rgba(124,196,255,.45)}
  .exp{margin-top:12px}
  .exp .bar{height:12px;border-radius:7px;background:rgba(0,0,0,.5);overflow:hidden;border:1px solid var(--line-soft);margin-top:4px}
  .exp .bar i{display:block;height:100%;border-radius:7px;transition:width .6s;
    background:linear-gradient(90deg,#caa24a,#f4c66a 60%,#ffe6a6);box-shadow:0 0 12px rgba(244,198,106,.5)}
  .exp .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-dim)}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  .card{position:relative;border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    background:linear-gradient(160deg,rgba(42,28,66,.82),rgba(15,10,25,.88));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 12px 30px rgba(0,0,0,.45)}
  .card::before{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(244,198,106,.5),transparent)}
  .card h3{font-family:var(--font-title);font-size:15px;letter-spacing:1px;margin-bottom:13px;padding-bottom:10px;
    display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(244,198,106,.16)}
  .stat-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
  .stat-row:last-child{border-bottom:none}
  .stat-row .v{font-variant-numeric:tabular-nums;font-weight:600}
  .attrs{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .attr{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--line-soft)}
  .attr .dot{width:9px;height:9px;border-radius:50%}
  .attr .k{font-size:13px;color:var(--ink-dim);width:24px}
  .attr .val{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
  .attr .bonus{color:var(--hp);font-size:11px;margin-left:5px}

  /* ── 大廳 lobby（手遊式位置佈局）── */
  .lobby{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 104px}
  .rail{position:absolute;top:4px;display:flex;flex-direction:column;gap:14px;z-index:2}
  .rail.left{left:0}.rail.right{right:0}
  .lobby-ic{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink-dim);font-size:10px;width:62px}
  .lobby-ic .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:25px;
    border:1px solid var(--line);background:linear-gradient(180deg,rgba(42,28,66,.92),rgba(15,10,25,.96));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 5px 14px rgba(0,0,0,.45);transition:.15s}
  .lobby-ic:hover{color:var(--gold)}
  .lobby-ic:hover .ic{border-color:var(--gold);box-shadow:0 0 0 1px rgba(244,198,106,.45),0 0 18px rgba(244,198,106,.25)}
  .stage{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-align:center;padding:0 76px}
  .hero-portrait{width:clamp(120px,34vw,170px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:78px;overflow:hidden;
    border:2px solid var(--gold);background:radial-gradient(circle at 50% 32%,rgba(124,58,237,.4),#0a0710 72%);
    box-shadow:0 0 0 6px rgba(244,198,106,.1),0 0 44px rgba(244,198,106,.3),inset 0 0 30px rgba(0,0,0,.55)}
  .hero-portrait img{width:100%;height:100%;object-fit:cover}
  .hero-name{font-family:var(--font-title);font-size:24px;letter-spacing:1px;text-shadow:0 2px 10px #000}
  .hero-tags{font-size:12px;color:var(--ink-dim)}
  .hero-exp{width:min(300px,76vw)}
  .cta-dock{position:absolute;left:0;right:0;bottom:8px;display:flex;align-items:flex-end;justify-content:center;gap:16px}
  .cta-main{font-size:18px;font-weight:700;padding:15px 34px;border-radius:16px;min-width:188px}
  .cta-mini{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-dim);cursor:pointer}
  .cta-mini .cm-ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:23px;
    border:1px solid var(--line);background:linear-gradient(180deg,rgba(42,28,66,.92),rgba(15,10,25,.96));box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 5px 14px rgba(0,0,0,.45);transition:.15s}
  .cta-mini:hover{color:var(--gold)}.cta-mini:hover .cm-ic{border-color:var(--gold);box-shadow:0 0 16px rgba(244,198,106,.25)}

  /* 建置中佔位 */
  .soon-page{display:grid;place-items:center;height:70%;text-align:center;color:var(--ink-dim)}
  .soon-page .be{font-size:54px;opacity:.6}
  .soon-page h2{font-family:var(--font-title);font-size:22px;color:var(--ink);margin:10px 0 6px;letter-spacing:1px}
  .soon-page .pz{font-size:12px;color:var(--gold);border:1px solid var(--line);border-radius:7px;padding:3px 10px;margin-top:10px;display:inline-block}
  .loading{display:grid;place-items:center;height:60%;color:var(--ink-dim)}

  /* ── P2 共用：toast / modal / tabs / 列表 ── */
  #toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;
    flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  .toast{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 18px;
    font-size:13.5px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tIn .25s}
  .toast.ok{border-color:rgba(93,255,160,.5);color:#bdffd8}
  .toast.err{border-color:rgba(255,120,120,.5);color:#ffc2c2}
  @keyframes tIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
  .modal-bg{position:fixed;inset:0;z-index:70;background:rgba(6,4,12,.6);display:grid;place-items:center;
    opacity:0;pointer-events:none;transition:.2s;padding:20px}
  .modal-bg.show{opacity:1;pointer-events:auto}
  .modal{width:min(440px,94vw);max-height:86vh;overflow-y:auto;border:1px solid var(--line);border-radius:16px;
    background:linear-gradient(180deg,var(--bg-2),var(--bg-1));padding:20px}
  .modal h3{font-family:var(--font-title);letter-spacing:1px;font-size:18px;margin-bottom:4px;display:flex;gap:10px;align-items:center}
  .modal .mthumb{width:48px;height:48px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:#0a0710}
  .modal .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sec-head .desc{font-size:12.5px;color:var(--ink-dim)}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tab{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:6px 14px;font-size:13px;color:var(--ink-dim)}
  .tab.active{background:rgba(244,198,106,.14);color:var(--gold);border-color:var(--gold)}

  /* 物品格 */
  .item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
  .icard{border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;transition:.15s;
    background:rgba(0,0,0,.22);position:relative;text-align:center}
  .icard:hover{transform:translateY(-2px);border-color:var(--gold)}
  .icard .ithumb{width:100%;aspect-ratio:1;border-radius:9px;object-fit:cover;background:#0a0710;margin-bottom:7px;
    display:grid;place-items:center;font-size:30px;border:1px solid var(--line-soft)}
  .icard .iname{font-size:12px;line-height:1.3;height:31px;overflow:hidden}
  .icard .ienh{position:absolute;top:6px;right:7px;font-size:10px;color:var(--gold);font-weight:700;text-shadow:0 1px 2px #000}
  .tier{position:absolute;top:6px;left:7px;font-size:9px;font-weight:700;padding:1px 6px;border-radius:5px;color:#150d00}
  .tier-SS,.tier-S{background:#ffcf5a}.tier-A{background:#ff9d6b}.tier-B{background:#b388ff;color:#0a0710}
  .tier-C{background:#7cc4ff;color:#0a0710}.tier-D{background:#9aa3b5;color:#0a0710}
  .qty{position:absolute;bottom:42px;right:8px;font-size:11px;background:rgba(0,0,0,.7);border-radius:5px;padding:0 6px}

  /* 裝備槽 */
  .slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .slot{border:1px solid var(--line-soft);border-radius:11px;padding:10px;background:rgba(0,0,0,.22);
    display:flex;gap:10px;align-items:center;min-height:62px}
  .slot.filled{cursor:pointer}.slot.filled:hover{border-color:var(--gold)}
  .slot .sthumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#0a0710;flex:none;
    display:grid;place-items:center;font-size:20px;border:1px solid var(--line-soft)}
  .slot .slabel{font-size:10px;color:var(--ink-dim)}
  .slot .sname{font-size:13px;margin-top:2px}
  .slot.empty{opacity:.5}

  /* 任務 */
  .quest{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:rgba(0,0,0,.2)}
  .quest .qh{display:flex;justify-content:space-between;align-items:start;gap:10px}
  .quest .qtt{font-weight:600;font-size:14px}.quest .qds{font-size:12px;color:var(--ink-dim);margin-top:3px}
  .quest .qbar{height:8px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;margin-top:9px;border:1px solid var(--line-soft)}
  .quest .qbar i{display:block;height:100%;background:linear-gradient(90deg,#43d17a,#1f9e57);border-radius:5px}
  .quest .qrew{font-size:11px;color:var(--gold);margin-top:7px}
  .listrow{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border:1px solid var(--line-soft);
    border-radius:10px;margin-bottom:8px;background:rgba(0,0,0,.2);font-size:13.5px}
  .listrow .r-amt{font-weight:700;font-variant-numeric:tabular-nums}
  .pos{color:#5dffa0}.neg{color:#ff8a8a}
  .code-box{font-family:var(--font-title);font-size:30px;letter-spacing:6px;color:var(--gold);text-align:center;
    border:1px dashed var(--line);border-radius:12px;padding:18px;margin:6px 0 14px;cursor:pointer}
  .field{display:flex;gap:8px;margin-top:10px}
  .field input{flex:1;padding:10px 13px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font-size:14px}
  .empty-note{text-align:center;color:var(--ink-dim);font-size:13px;padding:40px 0}

  /* ── P3 怪物區卡片 ── */
  .zone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .zcard{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(0,0,0,.25);position:relative}
  .zcard.locked{filter:grayscale(.7) brightness(.6)}
  .zcard .ztop{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line-soft);
    background:linear-gradient(180deg,var(--zc,#333) -90%,transparent)}

<script>
/* ============================================================
   API 層
   ============================================================ */
const API_BASE = ""; // 同源；正式機部署不需改
const TOKEN_KEY = "eg_token";
let TOKEN = localStorage.getItem(TOKEN_KEY) || null;
let PROFILE = null;

function unwrap(j){ return (j && j.status==="ok" && "data" in j) ? j.data : (j && j.data!==undefined ? j.data : j); }
async function api(path, opts={}){
  const headers = Object.assign({ "Content-Type":"application/json" }, opts.headers||{});
  if(TOKEN) headers["Authorization"] = "Bearer "+TOKEN;
  const res = await fetch(API_BASE+path, Object.assign({}, opts, { headers }));
  let j=null; try{ j=await res.json(); }catch(_){}
  if(!res.ok){ const msg=(j&&(j.message||j.error))||("HTTP "+res.status); const e=new Error(msg); e.status=res.status; e.body=j; throw e; }
  return unwrap(j);
}

async function login(code, redirectUri){
  const body = redirectUri ? { code, redirect_uri: redirectUri } : { code };
  const data = await api("/api/auth/discord", { method:"POST", body:JSON.stringify(body) });
  TOKEN = data.token; localStorage.setItem(TOKEN_KEY, TOKEN);
  return data;
}

/* ============================================================
   導航定義（= DC 全功能；標 phase 的尚未實作）
   ============================================================ */
const NAV = [
  { group:"大廳", items:[
    { id:"home", ic:"🏰", label:"冒險大廳" },
  ]},
  { group:"冒險", items:[
    { id:"zones",   ic:"⚔️", label:"怪物區" },
    { id:"idle",    ic:"⏳", label:"掛機區" },
    { id:"tower",   ic:"🗼", label:"爬塔" },
    { id:"pk",      ic:"🥊", label:"PK 擂台" },
    { id:"worldboss",ic:"🐲",label:"世界王" },
  ]},
  { group:"養成", items:[
    { id:"profile", ic:"📊", label:"角色資料" },
    { id:"inventory",ic:"🎒",label:"道具背包" },
    { id:"equip",   ic:"🛡️", label:"裝備欄" },
    { id:"enhance", ic:"⚗️", label:"裝備強化" },
    { id:"quests",  ic:"📋", label:"任務中心" },
    { id:"checkin", ic:"📅", label:"打卡" },
  ]},
  { group:"經濟", items:[
    { id:"shop",    ic:"🏪", label:"金幣商店" },
    { id:"auction", ic:"🔨", label:"拍賣場" },
    { id:"txn",     ic:"🧾", label:"交易紀錄" },
  ]},
  { group:"娛樂", items:[
    { id:"casino",  ic:"🎰", label:"賭場轉盤" },
    { id:"pet",     ic:"🥚", label:"寵物採集" },
  ]},
  { group:"社交", items:[
    { id:"chat",    ic:"💬", label:"聊天直播" },
    { id:"invite",  ic:"🎟️", label:"邀請碼" },
    { id:"bind",    ic:"🔗", label:"綁定直播", phase:"P5" },
  ]},
];
const SEC_NAME = {}; NAV.forEach(g=>g.items.forEach(i=>SEC_NAME[i.id]=i.label));

const SEC_ICON={}; NAV.forEach(g=>g.items.forEach(i=>SEC_ICON[i.id]=i.ic));
/* 手遊式底部主分頁 + 同一 tab 內的頂部子分頁（取代原本的網站側欄） */
const TABS=[
  {id:"home",ic:"🏰",label:"大廳"},
  {id:"adventure",ic:"⚔️",label:"冒險"},
  {id:"grow",ic:"🎒",label:"養成"},
  {id:"market",ic:"🏪",label:"商城"},
];
const HUBS={
  adventure:{items:["zones","idle","tower","pk","worldboss"]},
  grow:{items:["profile","inventory","equip","enhance","quests","checkin"]},
  market:{items:["shop","auction","casino","pet","txn"]},
};
const TAB_OF={home:"home"};
Object.entries(HUBS).forEach(([tab,info])=>info.items.forEach(s=>{TAB_OF[s]=tab;}));
function tabDefault(tab){ return tab==="home"?"home":(HUBS[tab]?HUBS[tab].items[0]:"home"); }
function renderTabs(active){
  const bar=document.getElementById("tabbar"); if(!bar) return;
  bar.innerHTML=TABS.map(t=>`<div class="tab-item${t.id===active?" active":""}" data-tab="${t.id}"><div class="ti-ic">${t.ic}</div><div>${t.label}</div></div>`).join("");
  bar.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>route(tabDefault(el.dataset.tab)));
}
function renderSubnav(tab,active){
  const sub=document.getElementById("subnav"); if(!sub) return;
  const items=(HUBS[tab]&&HUBS[tab].items)||[];
  sub.innerHTML = items.length>1 ? items.map(s=>`<div class="subtab${s===active?" active":""}" data-sub="${s}"><span style="margin-right:5px">${SEC_ICON[s]||""}</span>${SEC_NAME[s]}</div>`).join("") : "";
  sub.querySelectorAll("[data-sub]").forEach(t=>t.onclick=()=>route(t.dataset.sub));
}

/* ============================================================
   路由 / 區塊渲染
   ============================================================ */
const SECTIONS={
  home:renderHome, profile:renderProfile,
  inventory:renderInventory, equip:renderEquip, enhance:renderEnhance,
  quests:renderQuests, checkin:renderCheckin, invite:renderInvite, txn:renderTxn,

/* ── 共用：toast / modal / 重整 ── */
function toast(msg,type="ok"){
  let box=document.getElementById("toast"); if(!box){ box=document.createElement("div"); box.id="toast"; document.body.appendChild(box); }
  const t=document.createElement("div"); t.className="toast "+type; t.textContent=msg; box.appendChild(t);
  setTimeout(()=>{ t.style.opacity="0"; setTimeout(()=>t.remove(),300); },2600);
}
function closeModal(){ const m=document.getElementById("modalBg"); if(m) m.classList.remove("show"); }
function openModal(html){
  let m=document.getElementById("modalBg");
  if(!m){ m=document.createElement("div"); m.id="modalBg"; m.className="modal-bg"; document.body.appendChild(m);
    m.addEventListener("click",e=>{ if(e.target===m) closeModal(); }); }
  m.innerHTML=`<div class="modal">${html}</div>`; m.classList.add("show");
}

function itemThumb(it,cls){ const u=it.imageThumbnailUrl||it.imageUrl;

let INV_CACHE=null;
async function loadInv(){ INV_CACHE=await api("/api/me/inventory"); return INV_CACHE; }
const INV_SLOT_ORDER=["weapon","shield","armor","garment","shoes","head_top","head_mid","head_low","accessory_l","accessory_r","job_eq","special"];
function invCatOf(i){
  if(i.itemType==="equipment") return "equipment";
  if(i.itemType==="consumable") return "consumable";
  if(i.itemType==="material"||i.itemType==="pet_egg") return "material";
  return "other";
}
async function renderInventory(main){
  const {inventory}=await loadInv();
  const cats=[["all","全部"],["equipment","裝備"],["consumable","消耗品"],["material","材料"],["other","其他"]];
  const counts={all:inventory.length}; inventory.forEach(i=>{ const c=invCatOf(i); counts[c]=(counts[c]||0)+1; });
  let filter="all";
  function draw(){
    let list=inventory.filter(i=> filter==="all" ? true : invCatOf(i)===filter);
    list.sort((a,b)=>{
      // 裝備依槽位 → 階級；其他依階級 → 名稱
      if(filter==="equipment"||(filter==="all"&&a.itemType==="equipment"&&b.itemType==="equipment")){
        const sa=INV_SLOT_ORDER.indexOf(a.equipSlot), sb=INV_SLOT_ORDER.indexOf(b.equipSlot);
        if(sa!==sb) return (sa<0?99:sa)-(sb<0?99:sb);
      }
      const ta=TIER_RANK[a.tier]||0, tb=TIER_RANK[b.tier]||0;
      if(ta!==tb) return tb-ta;
      return String(a.name||a.itemName).localeCompare(String(b.name||b.itemName),"zh-Hant");
    });
    main.innerHTML=`
      <div class="sec-head"><div class="desc">共 ${inventory.length} 件物品 · 點物品可裝備 / 使用 / 販售</div></div>
      <div class="tabs">${cats.map(c=>`<div class="tab${c[0]===filter?" active":""}" data-f="${c[0]}">${c[1]}${counts[c[0]]?` <span style="opacity:.6">${counts[c[0]]}</span>`:""}</div>`).join("")}</div>
      <div class="item-grid">${list.map(itemCard).join("")||`<div class="empty-note">這個分類沒有物品</div>`}</div>`;
    main.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{filter=t.dataset.f;draw();});
    main.querySelectorAll(".icard").forEach(c=>c.onclick=()=>itemDetail(c.dataset.uuid));
  }
  draw();
}
function itemCard(it){
  return `<div class="icard" data-uuid="${it.uuid}">
    ${it.tier?`<span class="tier tier-${it.tier}">${it.tier}</span>`:""}
    ${it.enhanceLevel?`<span class="ienh">+${it.enhanceLevel}</span>`:""}
    ${itemThumb(it,"ithumb")}
    ${it.quantity>1?`<span class="qty">×${it.quantity}</span>`:""}
    <div class="iname">${it.name||it.itemName}</div></div>`;
}
function itemDetail(uuid){
  const it=INV_CACHE.inventory.find(i=>i.uuid===uuid); if(!it) return;
  const st=it.equipStats||{}; const statTxt=Object.entries(st).filter(([k,v])=>v).map(([k,v])=>`${k.toUpperCase()} +${v}`).join("　")||"—";
  const acts=[];
  if(it.equipSlot) acts.push(`<button class="btn primary" onclick="doEquip('${uuid}')">裝備</button>`);
  if(it.itemType==="consumable") acts.push(`<button class="btn primary" onclick="doUse('${uuid}')">使用</button>`);
  acts.push(`<button class="btn" onclick="doSell('${uuid}')">販售</button>`);
  acts.push(`<button class="btn" onclick="doDiscard('${uuid}','${(it.name||it.itemName).replace(/'/g,"")}')">丟棄</button>`);
  acts.push(`<button class="btn" onclick="closeModal()">關閉</button>`);
  openModal(`<h3>${itemThumb(it,"mthumb")} ${it.name||it.itemName}${it.enhanceLevel?` <span style="color:var(--gold)">+${it.enhanceLevel}</span>`:""}</h3>
    <div style="color:var(--ink-dim);font-size:12px;margin:6px 0 2px">${it.tier?("階級 "+it.tier+" · "):""}${it.equipSlot||it.itemType}</div>
    ${it.equipSlot?`<div class="stat-row"><span>裝備屬性</span><span class="v">${statTxt}</span></div>`:""}
    <div class="acts">${acts.join("")}</div>`);
}
async function itemAction(fn,okMsg){ try{ const r=await fn(); toast(r?.message||okMsg,"ok"); closeModal(); await loadInv(); await refreshProfile(); route(CUR_SEC);}catch(e){ toast(e.message,"err"); } }
function doEquip(u){ itemAction(()=>api(`/api/me/inventory/equip/${u}`,{method:"POST",body:"{}"}),"已裝備"); }
function doUse(u){ itemAction(()=>api(`/api/me/inventory/use/${u}`,{method:"POST",body:"{}"}),"已使用"); }

async function doSell(u){

/* ── 戰鬥動畫引擎（吃真實 roundLogs / quick-battle.logs）── */
const B={pHp:0,eHp:0,pMax:0,eMax:0,timer:null,playing:false,ctx:null,parts:[],eName:"",cur:null};
function bEl(id){return document.getElementById(id);}
function bFmt(n){return Number(n||0).toLocaleString("en-US");}
function bParse(line,eName){
  const esc=eName.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const rn=line.match(/第\s*(\d+)\s*回合/); if(rn) return {type:"round",round:+rn[1]};
  if(/────/.test(line)) return {type:"skip"};
  const skill=line.match(/發動【(.+?)】/), dmg=line.match(/造成\s*\*\*([\d,]+)\*\*\s*點/);
  const rE=line.match(new RegExp("(?:"+esc+"|怪物)\\s*剩\\s*([\\d,]+)\\s*HP")), rP=line.match(/你剩\s*([\d,]+)\s*HP/);
  const heal=line.match(/(?:回復|恢復)\s*\*\*([\d,]+)\*\*\s*HP/);
  const crit=/會心|爆擊|💥/.test(line), miss=/未命中|閃避|MISS/.test(line), stun=/擊暈|😵/.test(line);
  const win=/被擊敗|被擊殺|🏆/.test(line), dot=/(燒傷|中毒|流血|感電|詛咒|灼燒|毒素)/.test(line), phase=/進入第.+階段|提升/.test(line);
  const num=s=>s?parseInt(s.replace(/,/g,""),10):null;
  if(heal&&(rP||/你/.test(line))) return {type:"heal",value:num(heal[1]),playerHp:rP?num(rP[1]):null,skill:skill&&skill[1]};
  if(stun) return {type:"stun"};
  if(phase&&!dmg) return {type:"phase"};
  if(dmg&&rE) return {type:"hit",actor:"player",target:"enemy",value:num(dmg[1]),enemyHp:num(rE[1]),crit,skill:skill&&skill[1],dot:dot&&!crit};
  if(dmg&&rP) return {type:"hit",actor:"enemy",target:"player",value:num(dmg[1]),playerHp:num(rP[1]),dot};
  if(miss) return {type:"miss",target:/你/.test(line)?"player":"enemy"};
  if(win) return {type:"win"};
  return {type:"info"};
}
function bTimeline(logs,eName){
  const ev=[];
  logs.forEach((rd,ri)=>{ let st=false;
    String(rd).split("\n").map(s=>s.trim()).filter(Boolean).forEach(l=>{
      const e=bParse(l,eName);
      if(e.type==="round"){ev.push({type:"round",round:e.round!=null?e.round:ri+1});st=true;return;}
      if(e.type==="skip") return;
      if(!st){ev.push({type:"round",round:ri+1});st=true;}
      e.raw=l; ev.push(e);
    });
  });
  return ev;
}
function bHp(who){
  const isP=who==="player",cur=isP?B.pHp:B.eHp,max=isP?B.pMax:B.eMax,pct=Math.max(0,Math.min(100,cur/max*100));
  const f=bEl(isP?"bpHp":"beHp"),g=bEl(isP?"bpGhost":"beGhost"),t=bEl(isP?"bpHpText":"beHpText");
  f.style.width=pct+"%"; f.classList.toggle("low",pct<=30); g.style.width=pct+"%"; t.textContent=`${bFmt(Math.max(0,cur))} / ${bFmt(max)}`;
}
function bFloat(who,txt,cls){const el=document.createElement("div");el.className="float "+cls;el.textContent=txt;
  const r=bEl("battle").getBoundingClientRect(),p=bEl(who==="player"?"bfPlayer":"bfEnemy").getBoundingClientRect();
  el.style.left=(p.left-r.left+p.width/2+(Math.random()*40-20))+"px";el.style.top=(p.top-r.top+24)+"px";
  bEl("bFx").appendChild(el);setTimeout(()=>el.remove(),1100);}
function bBanner(t){const b=bEl("bBanner");b.textContent="【"+t+"】";b.classList.remove("show");void b.offsetWidth;b.classList.add("show");}
function bStatus(who,e){const box=bEl(who==="player"?"bpStatus":"beStatus");const s=document.createElement("span");s.textContent=e;box.innerHTML="";box.appendChild(s);setTimeout(()=>s.remove(),1800);}
function bShake(){const f=bEl("battle");f.classList.remove("shaking");void f.offsetWidth;f.classList.add("shaking");}
function bFlash(){const f=bEl("bFlash");f.style.transition="none";f.style.opacity=".5";requestAnimationFrame(()=>{f.style.transition="opacity .3s";f.style.opacity="0";});}
function bAttack(who){const f=bEl(who==="player"?"bfPlayer":"bfEnemy");f.classList.add(who==="player"?"lunge-right":"lunge-left");setTimeout(()=>f.classList.remove("lunge-right","lunge-left"),220);}
function bHit(who){const p=bEl(who==="player"?"bpPort":"bePort");p.classList.remove("hit");void p.offsetWidth;p.classList.add("hit");}
function bBurst(who,color,n,power){const p=bEl(who==="player"?"bfPlayer":"bfEnemy").getBoundingClientRect(),r=bEl("battle").getBoundingClientRect();
  const x=p.left-r.left+p.width/2,y=p.top-r.top+p.height*0.45;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=Math.random()*power+1.5;B.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,color,size:Math.random()*4+2});}}
function bTick(){const cv=bEl("bParticles"),ctx=B.ctx;if(!ctx)return;ctx.clearRect(0,0,cv.width,cv.height);
  B.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life-=0.025;ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill();});
  B.parts=B.parts.filter(p=>p.life>0);ctx.globalAlpha=1;requestAnimationFrame(bTick);}
function bSize(){const cv=bEl("bParticles"),f=bEl("battle");cv.width=f.clientWidth;cv.height=f.clientHeight;}
function bApply(ev){
  if(ev.raw) bEl("bLog").innerHTML=ev.raw.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  if(ev.type==="round"){bEl("bRound").textContent="回合 "+ev.round;return;}
  if(ev.type==="hit"){bAttack(ev.actor);
    setTimeout(()=>{bHit(ev.target);if(ev.skill)bBanner(ev.skill);
      if(ev.crit){bFloat(ev.target,"-"+bFmt(ev.value),"crit");bShake();bFlash();bBurst(ev.target,"#ff7a3c",40,7);}
      else if(ev.dot){bFloat(ev.target,"-"+bFmt(ev.value),"dot");bBurst(ev.target,"#b06bff",14,3);}
      else{bFloat(ev.target,"-"+bFmt(ev.value),ev.skill?"crit":"dmg");bBurst(ev.target,ev.actor==="player"?"#ffd84d":"#ff5c7a",ev.skill?30:18,ev.skill?6:4);}
      if(ev.target==="enemy"&&ev.enemyHp!=null)B.eHp=ev.enemyHp;if(ev.target==="player"&&ev.playerHp!=null)B.pHp=ev.playerHp;bHp(ev.target);},130);
    return;}
  if(ev.type==="heal"){const p=bEl("bpPort");p.classList.remove("heal-glow");void p.offsetWidth;p.classList.add("heal-glow");
    if(ev.skill)bBanner(ev.skill);bFloat("player","+"+bFmt(ev.value),"heal");bBurst("player","#5dffa0",24,4);
    B.pHp=ev.playerHp!=null?ev.playerHp:Math.min(B.pMax,B.pHp+ev.value);bHp("player");return;}
  if(ev.type==="miss"){bFloat(ev.target,"MISS","miss");return;}
  if(ev.type==="stun"){bStatus("enemy","😵");bBanner("擊暈");return;}
  if(ev.type==="phase"){bStatus("enemy","🔺");bBanner("階段轉換");bShake();return;}
}
function bStep(tl,i){
  if(!B.playing) return;
  if(i>=tl.length){ bFinish(); return; }
  const ev=tl[i]; bApply(ev);
  const d=({round:480,hit:680,heal:760,stun:720,phase:840,miss:520,info:440}[ev.type]||460);
  B.timer=setTimeout(()=>bStep(tl,i+1),d);
}
function bFinish(){
  B.playing=false; const win=B.cur.outcome==="win";
  B.eHp=win?0:B.eHp; B.pHp=(B.cur.finalPlayerHp!=null?B.cur.finalPlayerHp:B.pHp); bHp("player"); bHp("enemy");
  const rew=(B.cur.rewardLines||[]).map(l=>String(l).replace(/\*\*(.+?)\*\*/g,"$1")).join("<br>");
  bEl("bResultBig").textContent=win?"VICTORY":"DEFEAT";
  bEl("bResultRew").innerHTML=rew||(win?"擊敗了 "+B.cur.enemyName:"再接再厲");
  // 爬塔模式：隱藏「再戰」，返回鍵回爬塔頁繼續
  bEl("bAgain").style.display=B.cur.isTower?"none":"";
  bEl("bExit").textContent=B.cur.isTower?"繼續":"返回";
  bEl("bResult").className="bresult show "+(win?"win":"lose");
  if(win){bBurst("enemy","#f4c66a",60,8);bShake();}
}
function playRealBattle(cfg){
  B.cur=cfg; B.eName=cfg.enemyName;
  B.pMax=cfg.playerMaxHp||100; B.eMax=cfg.enemyMaxHp||1; B.pHp=B.pMax; B.eHp=B.eMax;
  bEl("bpName").textContent=PROFILE?.player?.displayName||"我";
  bEl("bpLv").textContent="Lv "+(PROFILE?.progress?.level||1);
  bEl("beName").textContent=cfg.enemyName; bEl("beLv").textContent="";
  bEl("bpPort").textContent="🛡️";
  bEl("bePort").innerHTML=cfg.enemyImg?`<img src="${cfg.enemyImg}">`:"🐲";
  bEl("bResult").className="bresult";
  bEl("bLog").textContent="戰鬥開始！";
  const bt=bEl("battle"); bt.classList.add("show");
  if(!B.ctx) B.ctx=bEl("bParticles").getContext("2d");
  bSize(); bTick();
  bHp("player"); bHp("enemy");
  B.playing=true; B.parts=[];
  const tl=cfg.timeline||bTimeline(cfg.logs||[],cfg.enemyName);
  clearTimeout(B.timer); setTimeout(()=>bStep(tl,0),400);
}
function bClose(){ B.playing=false; clearTimeout(B.timer); bEl("battle").classList.remove("show"); refreshProfile(); route(CUR_SEC); }
bEl("bSkip").onclick=()=>{ if(B.playing){B.playing=false;clearTimeout(B.timer);bFinish();} };
bEl("bExit").onclick=bClose;
bEl("bAgain").onclick=()=>{ const c=B.cur; bEl("battle").classList.remove("show"); startBattle(c.zoneKey,c.zoneInfo); };
window.addEventListener("resize",()=>{ if(bEl("battle").classList.contains("show")) bSize(); });

function chatContent(c){
  return (c||"")
    .replace(/<a?:(\w+):(\d+)>/g,'<img src="https://cdn.discordapp.com/emojis/$2.png?size=32" style="height:20px;vertical-align:-4px">')
    .replace(/(https?:\/\/\S+\.(?:png|jpg|jpeg|gif|webp))(\?\S*)?/gi,'<br><img src="$1" style="max-width:180px;border-radius:8px;margin-top:4px">')
    .replace(/(https?:\/\/\S+)/g,'<a href="$1" target="_blank" style="color:var(--mp)">連結</a>');
}
async function renderChat(main){
  main.innerHTML=`<div class="sec-head"><div class="desc">小鎮大廳 · 與 Discord 同步的聊天</div></div>
    <div id="chatBox" class="scroll" style="border:1px solid var(--line);border-radius:12px;padding:12px;height:calc(100% - 110px);overflow-y:auto;background:rgba(0,0,0,.2)"></div>
    <div class="field"><input id="chatIn" placeholder="輸入訊息，與小鎮對話…" maxlength="300"><button class="btn primary" id="chatSend">送出</button></div>`;
  async function load(){
    try{ const h=await api("/api/chat/history?limit=40"); const box=main.querySelector("#chatBox");
      box.innerHTML=h.map(m=>`<div style="display:flex;gap:9px;margin-bottom:11px">
        <img src="${m.avatar}" style="width:30px;height:30px;border-radius:50%;flex:none" onerror="this.style.visibility='hidden'">
        <div><div style="font-size:12px;color:${m.isBot?'var(--gold)':'var(--mp)'}">${m.author}<span style="color:var(--ink-dim);margin-left:7px">${new Date(m.timestamp).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})}</span></div>
        <div style="font-size:13.5px;margin-top:1px">${chatContent(m.content)}</div></div></div>`).join("");
      box.scrollTop=box.scrollHeight;
    }catch(e){ main.querySelector("#chatBox").innerHTML=`<div class="empty-note">無法載入聊天：${e.message}</div>`; }
  }
  await load();
  const send=async()=>{ const inp=main.querySelector("#chatIn"); const msg=inp.value.trim(); if(!msg)return;
    inp.value=""; try{ await api("/api/chat/lobby",{method:"POST",body:JSON.stringify({message:msg})}); setTimeout(load,800); }catch(e){ toast(e.message,"err"); } };
  main.querySelector("#chatSend").onclick=send;
  main.querySelector("#chatIn").addEventListener("keydown",e=>{ if(e.key==="Enter")send(); });
}

const CASINO_HEX={yellow:"#f4c66a",green:"#43d17a",red:"#ff5c7a",blue:"#5aa9ff",purple:"#b388ff"};
let casinoBetAmt=1000;
async function renderCasino(main){
  let data=null;
  async function pull(){ try{ data=await api("/api/casino/state"); draw(); }catch(e){ if(!data) main.innerHTML=`<div class="empty-note">賭場載入失敗：${e.message}</div>`; } }
  function draw(){
    if(!data) return;
    const r=data.round, colors=data.colors||{};
    const remain=r?Math.max(0,Math.round(((r.status==="open"?r.lockedAt:r.endAt)-(data.now||Date.now()))/1000)):0;
    const locked=!r||r.status!=="open"||remain<=0;
    const myByColor={}; (data.myBets||[]).forEach(b=>myByColor[b.color]=(myByColor[b.color]||0)+b.amount);
    main.innerHTML=`<div class="sec-head">
        <div class="desc">命運轉盤 · 第 #${r?r.roundId:"—"} 輪</div>
        <span class="tag" style="color:${locked?'#ff8a8a':'#5dffa0'}">${locked?"🔒 已鎖盤":`⏳ ${remain}s 後鎖盤`}</span></div>
      <div style="display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap">${(data.recent||[]).slice(0,12).map(x=>{
        const col=x.resultColor||x.color; return `<span title="×${x.resultMult||x.mult}" style="width:18px;height:18px;border-radius:50%;background:${CASINO_HEX[col]||'#555'};display:inline-block;box-shadow:0 0 6px ${CASINO_HEX[col]||'#555'}"></span>`;}).join("")||`<span class="desc">尚無開獎紀錄</span>`}</div>
      <div class="item-grid" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">
        ${Object.keys(colors).map(k=>{
          const m=colors[k], pool=r?.totals?.[k]||0, mine=myByColor[k]||0;
          return `<div class="card" style="text-align:center;border-color:${CASINO_HEX[k]};${locked?'opacity:.55':''}" ${locked?"":`data-bet="${k}"`}>
            <div style="font-size:34px">${m.emoji}</div>
            <div class="h-title" style="font-size:16px;color:${CASINO_HEX[k]}">${m.label} ×${m.mult}</div>
            <div class="desc" style="margin-top:4px">本輪押注 ${fmt(pool)}</div>
            ${mine?`<div style="color:var(--gold);font-size:12px;margin-top:3px">你已押 ${fmt(mine)}</div>`:""}
            ${locked?"":`<div class="btn primary" style="margin-top:8px;padding:6px">押 ${fmt(casinoBetAmt)}</div>`}</div>`;
        }).join("")}</div>
      <div class="card" style="margin-top:16px"><h3>下注金額</h3>
        <div class="field"><input id="casAmt" type="number" style="max-width:160px" value="${casinoBetAmt}" min="${data.betMin}" max="${data.betMax}">
          ${[100,1000,5000,10000].map(a=>`<button class="btn" data-amt="${a}">${fmt(a)}</button>`).join("")}</div>
        <div class="desc" style="margin-top:8px">限額 ${fmt(data.betMin)} ~ ${fmt(data.betMax)} 金幣　·　押中該色即依倍率賠付，並有機率掉落道具</div></div>`;
    main.querySelectorAll("[data-amt]").forEach(b=>b.onclick=()=>{ casinoBetAmt=Number(b.dataset.amt); main.querySelector("#casAmt").value=casinoBetAmt; });
    const amtIn=main.querySelector("#casAmt"); if(amtIn) amtIn.onchange=()=>{ casinoBetAmt=Math.max(data.betMin,Math.min(data.betMax,Number(amtIn.value)||data.betMin)); };
    main.querySelectorAll("[data-bet]").forEach(c=>c.onclick=()=>casinoBet(c.dataset.bet));
  }
  async function casinoBet(color){
    try{ const amt=casinoBetAmt;
      const r=await api("/api/casino/bet",{method:"POST",body:JSON.stringify({color,amount:amt})});
      toast(`已押 ${colorLabel(color)} ${fmt(amt)} 🪙`,"ok"); await refreshProfile(); pull();
    }catch(e){ toast(e.message,"err"); }
  }
  function colorLabel(c){ return (data?.colors?.[c]?.label)||c; }
  await pull();
  activePoll=setInterval(pull,2000);
}

function petCard(p,activeUuid){

    ${p.stage==="egg"
      ? `<div class="qbar" style="margin-top:10px"><i style="width:${p.hatchPct}%;background:linear-gradient(90deg,#f4c66a,#caa24a)"></i></div><div class="desc" style="margin-top:5px">孵化進度 ${p.hatchPct}%</div>`
      : `<div class="stat-row"><span>飽食度</span><span class="v">${p.satiety}/${p.satietyMax}</span></div>

    <div class="acts" style="margin-top:12px">
      <button class="btn" data-pet="${p.uuid}" data-act="feed">餵食</button>
      ${p.stage!=="egg"&&p.gatherCount?`<button class="btn primary" data-pet="${p.uuid}" data-act="claim">收取 ${p.gatherCount}</button>`:""}
      ${p.stage!=="egg"&&!isActive?`<button class="btn" data-pet="${p.uuid}" data-act="active">出戰</button>`:""}
      <button class="btn" data-pet="${p.uuid}" data-act="rename">改名</button>
      <button class="btn" data-pet="${p.uuid}" data-act="release">放生</button>
    </div></div>`;
}
async function petActionMenu(uuid,act,main){
  try{
    if(act==="claim"){ const r=await api("/api/me/pets/claim",{method:"POST",body:"{}"}); toast(r?.message||"已收取","ok"); await refreshProfile(); return renderPet(main); }
    if(act==="active"){ await api("/api/me/pets/active",{method:"POST",body:JSON.stringify({petUuid:uuid})}); toast("已設為出戰寵物","ok"); return renderPet(main); }

    if(act==="feed"){ return petFeedModal(uuid,main); }
  }catch(e){ toast(e.message,"err"); }
}

    try{ const r=await api("/api/me/pets/feed",{method:"POST",body:JSON.stringify({petUuid:uuid,inventoryUuid:c.dataset.uuid})});
      toast(r?.message||"餵食完成","ok"); closeModal(); await loadInv(); renderPet(main);
    }catch(e){ toast(e.message,"err"); }
  });
}

/* ============================================================
   P5：單人爬塔（逐層挑戰 + 戰鬥動畫 + 繼續/撤退）
   ============================================================ */
async function renderTower(main){
  const d=await api("/api/tower/state");
  if(d.session){
    const s=d.session, hpPct=Math.round(s.playerHp/s.playerMaxHp*100);
    main.innerHTML=`<div class="narrow"><div class="sec-head"><div class="desc">攻塔進行中 · HP 會帶到下一層，不回血</div></div>
      <div class="card" style="text-align:center">
        <div style="font-size:46px">🗼</div>
        <div class="h-title" style="font-size:24px;margin-top:4px">第 ${s.floor} 層 / ${d.totalFloors}</div>
        <div class="exp" style="max-width:340px;margin:14px auto 4px">
          <div class="lbl"><span>HP</span><span>${fmt(s.playerHp)} / ${fmt(s.playerMaxHp)}</span></div>
          <div class="bar"><i style="width:${hpPct}%;background:${hpPct<=30?'linear-gradient(90deg,#ff7a5c,#e0533b)':'linear-gradient(90deg,#43d17a,#1f9e57)'}"></i></div></div>
        <div class="acts" style="justify-content:center;margin-top:18px">
          <button class="btn primary" id="twFight">⚔️ 挑戰第 ${s.floor} 層</button>
          <button class="btn" id="twRetreat">🏳️ 撤退領獎</button></div>
        <div class="desc" style="margin-top:10px">撤退會依「已通關層數」結算金幣與經驗</div></div></div>`;
    main.querySelector("#twFight").onclick=towerFight;
    main.querySelector("#twRetreat").onclick=towerRetreat;
  } else {
    const locked=d.level<d.minLevel;
    main.innerHTML=`<div class="narrow"><div class="sec-head"><div class="desc">單人無盡塔 · 共 ${d.totalFloors} 層，越高獎勵越豐厚</div></div>
      <div class="card" style="text-align:center">
        <div style="font-size:54px;${locked?'filter:grayscale(1) opacity(.6)':''}">🗼</div>
        <div class="h-title" style="font-size:20px;margin-top:6px">無盡之塔</div>
        <div class="desc" style="margin-top:6px">歷史最高：第 <b style="color:var(--gold)">${d.bestFloor}</b> 層</div>
        ${locked
          ? `<div class="lockmsg" style="margin-top:14px">🔒 需 Lv.${d.minLevel} 以上才能挑戰（目前 Lv.${d.level}）</div>`
          : `<div class="acts" style="justify-content:center;margin-top:18px"><button class="btn primary" id="twStart">開始爬塔</button></div>`}
      </div></div>`;
    const b=main.querySelector("#twStart"); if(b) b.onclick=async()=>{ try{ await api("/api/tower/start",{method:"POST",body:"{}"}); renderTower(main); }catch(e){ toast(e.message,"err"); } };
  }
}
async function towerFight(){
  toast("挑戰中…");
  try{
    const r=await api("/api/tower/fight",{method:"POST",body:"{}"});
    const rew=[];
    if(r.cleared) rew.push(`✅ 通過第 ${r.floor} 層！`); else rew.push(`止步於第 ${r.floor} 層`);
    if(r.towerOver){ rew.push(r.died?"你已倒下，本次攻塔結束":"本次攻塔結束");
      if(r.reward) rew.push(`結算（已通關 ${r.reward.clearedFloor} 層）：🪙 ${fmt(r.reward.gold)}　✨ ${fmt(r.reward.exp)} EXP`);
    } else rew.push(`HP ${fmt(r.finalPlayerHp)} / ${fmt(r.playerMaxHp)}　·　可繼續第 ${r.nextFloor} 層`);
    playRealBattle({
      enemyName:r.monsterName, enemyImg:r.monsterImageUrl, enemyMaxHp:r.enemyMaxHp,
      playerMaxHp:r.playerMaxHp, logs:r.logs,
      outcome:r.cleared?"win":"lose", finalPlayerHp:r.finalPlayerHp, finalMonsterHp:r.finalMonsterHp,
      rewardLines:rew, zoneKey:null, zoneInfo:null, isTower:true,
    });
  }catch(e){ toast(e.message,"err"); }
}
async function towerRetreat(){
  if(!confirm("確定撤退？將依已通關層數結算獎勵。"))return;
  try{ const r=await api("/api/tower/retreat",{method:"POST",body:"{}"});
    if(r.reward) toast(`撤退結算：通關 ${r.reward.clearedFloor} 層，獲得 ${fmt(r.reward.gold)} 🪙`,"ok");
    await refreshProfile(); route("tower");
  }catch(e){ toast(e.message,"err"); }
}

/* ============================================================
   P5：PK 擂台（與 Discord 共用同一擂台；即時大廳 + 結算播動畫）
   ============================================================ */
let pkBetAmt=1000, pkSeenResultAt=0, pkPrevArenaIdx=-1;
function bPkTimeline(logs,you,opp){
  const esc=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const reRem=new RegExp("("+esc(you)+"|"+esc(opp)+")\\s*剩\\s*([\\d,]+)\\s*HP");
  const N=s=>s?parseInt(s.replace(/,/g,""),10):null;
  const ev=[];
  (logs||[]).forEach((rd,ri)=>{
    let started=false;
    String(rd).split("\n").map(s=>s.trim()).filter(Boolean).forEach(l=>{
      const rn=l.match(/第\s*(\d+)\s*回合/);
      if(rn){ ev.push({type:"round",round:+rn[1]}); started=true; return; }
      if(/────/.test(l)) return;
      if(!started){ ev.push({type:"round",round:ri+1}); started=true; }
      const skill=l.match(/發動【(.+?)】/), dmg=l.match(/造成\s*\*\*([\d,]+)\*\*\s*點/), rem=l.match(reRem);
      const heal=l.match(/(?:回復|恢復)\s*\*\*([\d,]+)\*\*\s*HP/), crit=/會心|爆擊|💥/.test(l);
      if(heal && l.includes(you)){ ev.push({type:"heal",target:"player",value:N(heal[1]),skill:skill&&skill[1],raw:l}); return; }
      if(dmg&&rem){
        const defender=rem[1], remain=N(rem[2]);
        if(defender===you) ev.push({type:"hit",actor:"enemy",target:"player",value:N(dmg[1]),playerHp:remain,raw:l});
        else ev.push({type:"hit",actor:"player",target:"enemy",value:N(dmg[1]),enemyHp:remain,crit,skill:skill&&skill[1],raw:l});
        return;
      }
      if(/未命中|閃避|MISS/.test(l)){ ev.push({type:"miss",target:l.includes(you)?"enemy":"player",raw:l}); return; }
      ev.push({type:"info",raw:l});
    });
  });
  return ev;
}
async function playPkResult(lr){
  pkSeenResultAt=lr.at;
  playRealBattle({
    enemyName:lr.oppName, enemyImg:null, enemyMaxHp:lr.oppMaxHp, playerMaxHp:lr.youMaxHp,
    timeline:bPkTimeline(lr.logs,lr.youName,lr.oppName),
    outcome:lr.youWon?"win":"lose", finalPlayerHp:null, finalMonsterHp:0,
    rewardLines:[lr.youWon?`🏆 你擊敗了 ${lr.oppName}！`:(lr.youWon===false?`敗給 ${lr.oppName}`:`與 ${lr.oppName} 平手`)],
    isTower:true,
  });
}
async function renderPk(main){
  pkSeenResultAt=Date.now(); pkPrevArenaIdx=-1;
  let data=null;
  async function pull(){
    try{ data=await api("/api/pk/state"); draw();
      // 我的對戰結算 → 播動畫
      if(pkPrevArenaIdx>=0 && data.myArenaIdx<0){
        const lr=await api("/api/pk/last-result");
        if(lr && lr.at>pkSeenResultAt) playPkResult(lr);
      }
      pkPrevArenaIdx=data.myArenaIdx;
    }catch(e){ if(!data) main.innerHTML=`<div class="empty-note">PK 載入失敗：${e.message}</div>`; }
  }
  function draw(){
    if(!data) return;
    const inArena=data.myArenaIdx>=0;
    main.innerHTML=`<div class="sec-head">
        <div class="desc">擂台與 Discord 共用 · 排隊中 ${data.queueCount} 人${inArena?`　·　你在擂台 ${data.myArenaIdx+1}`:""}</div>
        ${inArena?`<span class="tag" style="color:var(--gold)">配對中</span>`
          :data.inQueue?`<button class="btn" id="pkLeave">離開排隊</button>`
          :`<button class="btn primary" id="pkJoin">加入排隊</button>`}</div>
      <div class="zone-grid">${data.slots.map(pkSlotCard).join("")}</div>
      <div class="card" style="margin-top:16px"><h3>下注金額</h3>
        <div class="field"><input id="pkAmt" type="number" style="max-width:160px" value="${pkBetAmt}" min="100">
          ${[100,1000,5000].map(a=>`<button class="btn" data-pamt="${a}">${fmt(a)}</button>`).join("")}</div>
        <div class="desc" style="margin-top:8px">押中對戰勝方依賠率返還；參賽者不能押自己的場</div></div>`;
    const j=main.querySelector("#pkJoin"); if(j) j.onclick=()=>pkAction("join");
    const lv=main.querySelector("#pkLeave"); if(lv) lv.onclick=()=>pkAction("leave");
    main.querySelectorAll("[data-pamt]").forEach(b=>b.onclick=()=>{ pkBetAmt=Number(b.dataset.pamt); main.querySelector("#pkAmt").value=pkBetAmt; });
    const amt=main.querySelector("#pkAmt"); if(amt) amt.onchange=()=>{ pkBetAmt=Math.max(100,Number(amt.value)||100); };
    main.querySelectorAll("[data-pkbet]").forEach(b=>b.onclick=()=>pkBet(Number(b.dataset.arena),b.dataset.pkbet));
  }
  async function pkAction(kind){ try{ const r=await api("/api/pk/"+kind,{method:"POST",body:"{}"}); toast(r?.message||"OK","ok"); pull(); }catch(e){ toast(e.message,"err"); } }
  async function pkBet(arenaIdx,side){ try{ const r=await api("/api/pk/bet",{method:"POST",body:JSON.stringify({arenaIdx,side,amount:pkBetAmt})}); toast(r?.message||"已下注","ok"); await refreshProfile(); pull(); }catch(e){ toast(e.message,"err"); } }
  await pull();
  activePoll=setInterval(pull,2500);
}
function pkSlotCard(s){
  const head=`<div class="ztop"><span class="ze">🥊</span><span class="znm">擂台 ${s.idx+1}</span><span class="zlv">${({empty:"空閒",waiting:"等待對手",betting:"下注中",fighting:"對戰中"})[s.state]||s.state}</span></div>`;
  if(s.state==="empty") return `<div class="zcard" style="opacity:.5">${head}<div class="mon"><div class="empty-note" style="padding:18px">無人挑戰</div></div></div>`;
  const c=s.challenger, d=s.defender;
  const fighter=(p,side)=>`<div style="flex:1;text-align:center">
    <div style="font-size:13px;font-weight:600">${p?p.name:"—"}</div>
    <div class="desc">Lv ${p?p.level:"?"}${s.odds?`　賠率 ${s.odds[side].toFixed(2)}`:""}</div>
    ${s.state==="betting"&&p?`<button class="btn ${s.myBet&&s.myBet.side===side?'active':'primary'}" style="padding:5px 10px;margin-top:6px" data-pkbet="${side}" data-arena="${s.idx}">押 ${p.name}</button>`:""}</div>`;
  return `<div class="zcard">${head}<div class="mon" style="align-items:center">
    ${fighter(c,"challenger")}<div style="font-family:var(--font-title);color:var(--gold)">VS</div>${fighter(d,"defender")}
  </div>${s.myBet?`<div class="zfoot"><div class="lockmsg" style="color:var(--gold)">你押了 ${fmt(s.myBet.amount)} → ${s.myBet.side==="challenger"?(c?c.name:"挑戰者"):(d?d.name:"防守方")}（中可得 ${fmt(s.myBet.payout)}）</div></div>`:""}</div>`;
}

/* ============================================================
   啟動
   ============================================================ */
async function boot(){
  try{
    PROFILE = await api("/api/me/profile");
    // 頂部
    const p=PROFILE;
    document.getElementById("meName").textContent=p.player.displayName||p.player.name||"冒險者";
    document.getElementById("meSub").textContent=`Lv ${p.progress.level} · ${p.progress.job||"Novice"}`;
    if(p.player.avatarUrl){ document.getElementById("meAv").outerHTML=`<img id="meAv" src="${p.player.avatarUrl}">`; }
    document.getElementById("wGold").textContent="🪙 "+fmt(p.wallet?.gold ?? p.wallet?.coins ?? 0);
    const dia=p.wallet?.diamond ?? p.wallet?.diamonds;
    const diaEl=document.getElementById("wDia");
    if(dia!=null) diaEl.textContent="💎 "+fmt(dia); else diaEl.style.display="none";
    // 顯示 app
    document.getElementById("login").classList.add("hide");
    document.getElementById("app").classList.add("ready");
    route("home");
  }catch(e){
    // token 失效 → 回登入
    localStorage.removeItem(TOKEN_KEY); TOKEN=null;
    document.getElementById("login").classList.remove("hide");
    document.getElementById("app").classList.remove("ready");
    if(e.status && e.status!==401) document.getElementById("loginErr").textContent=e.message;
  }
}

document.getElementById("btnMock").onclick=async()=>{
  const err=document.getElementById("loginErr"); err.textContent="";
  try{
    const id=document.getElementById("mockId").value.trim();
    await login("mock:"+id);
    boot();
  }catch(e){ err.textContent=e.message; }
};
document.getElementById("btnDiscord").onclick=()=>{
  // 正式 OAuth：導向 Discord 授權（callback 回本頁帶 code）
  window.location.href="/api/auth/discord/login?returnTo="+encodeURIComponent(location.pathname);
};
document.getElementById("mockId").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("btnMock").click(); });

/* 登出 */
function logout(){
  if(!confirm("確定登出？"))return;
  if(activePoll){ clearInterval(activePoll); activePoll=null; }
  localStorage.removeItem(TOKEN_KEY); TOKEN=null; PROFILE=null;
  document.getElementById("meMenu").classList.remove("show");
  document.getElementById("app").classList.remove("ready");
  document.getElementById("login").classList.remove("hide");
  document.getElementById("mockId").value="";
  document.getElementById("loginErr").textContent="";
}
document.getElementById("meBox").addEventListener("click",(e)=>{ e.stopPropagation(); document.getElementById("meMenu").classList.toggle("show"); });
document.getElementById("mmLogout").addEventListener("click",(e)=>{ e.stopPropagation(); logout(); });
document.getElementById("mmBind").addEventListener("click",(e)=>{ e.stopPropagation(); document.getElementById("meMenu").classList.remove("show"); route("bind"); });
document.addEventListener("click",()=>{ const m=document.getElementById("meMenu"); if(m) m.classList.remove("show"); });

// Discord OAuth 回呼：網址帶 ?code= → 換 token
const _q=new URLSearchParams(location.search);
if(_q.get("code")){
  const redirectUri=location.origin+location.pathname;
  document.getElementById("loginErr").textContent="Discord 登入中…";
  login(_q.get("code"), redirectUri)
    .then(()=>{ history.replaceState({},"",location.pathname); boot(); })
    .catch(e=>{ history.replaceState({},"",location.pathname); document.getElementById("loginErr").textContent="Discord 登入失敗："+e.message; });
} else if(TOKEN){
  boot();
}
</script>
